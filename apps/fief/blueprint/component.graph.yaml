# Draft generated by `grafcode extract`; the blueprint block names this graph (the other fief graphs have one).
blueprint:
  id: fief_component
  schema_version: "2.2"
  graph_schema_version: "2.1"
  domain_type: software
  provenance: reverse
  parent_blueprint: null
  lineage: []

form:
  nodes:
    webhooks_router:
      spec:
        contract: |
          POST /{id}/secret calls Webhook.regenerate_secret() and persists; returns new WebhookSecret.
          events is validated against WebhookEventType (derived from WEBHOOK_EVENTS registry).
          Mutations emit audit log; no webhook events fired for webhook CRUD itself.
      verification:
        node: |
          - POST / returns WebhookSecret with plaintext secret
          - GET /{id} returns Webhook without secret field
          - POST /{id}/secret changes stored secret and returns new plaintext value
      docs: |
        - secret is write-once per creation/rotation; never retrievable from GET

    api_app:
      kind: module
      defines: |
        Top-level FastAPI application factory: creates the app instance, mounts all
        nine admin API routers under /api/ with their prefixes, configures CORS,
        global exception handlers, OpenAPI metadata, and application lifespan
        (DB connectivity check, default email template seeding).
      composed_of: [clients_router, tenants_router, users_router, permissions_router, roles_router, oauth_providers_router, email_templates_router, user_fields_router, webhooks_router, fastapi]
      tier: 7
      spec:
        interface: |
          app: FastAPI   # importable as fief.app:app
          # Router mounts (all under prefix /api, each with is_authenticated_admin_api at router level):
          #   /api/clients           <- clients_router
          #   /api/tenants           <- tenants_router
          #   /api/users             <- users_router
          #   /api/permissions       <- permissions_router
          #   /api/roles             <- roles_router
          #   /api/oauth-providers   <- oauth_providers_router
          #   /api/email-templates   <- email_templates_router
          #   /api/user-fields       <- user_fields_router
          #   /api/webhooks          <- webhooks_router
          # Lifespan:
          #   startup: verify DB connection; seed one EmailTemplate row per EmailTemplateType if absent
          #   shutdown: dispose engine
        contract: |
          All /api/* routes return 401 for unauthenticated requests (enforced at router level).
          CORS allowed origins configured via settings.ALLOWED_ORIGINS.
          OpenAPI schema served at /docs and /openapi.json.
          Lifespan seeding is idempotent; re-running against an existing DB is safe.
      verification:
        node: |
          - App starts without error given a valid DATABASE_URL
          - All nine /api/* prefixes respond to OPTIONS (CORS preflight)
          - /docs returns HTTP 200 with OpenAPI schema
          - Startup seeds missing EmailTemplate rows without duplicating existing ones
      docs: |
        - Entry point: uvicorn fief.app:app --host 0.0.0.0 --port 8000

function:
  exports:
    - name: list_clients
      kind: port
      from: clients_router.list_clients
      signature: "GET /api/clients/ -> PaginatedResults[Client]"
    - name: create_client
      kind: port
      from: clients_router.create_client
      signature: "POST /api/clients/ -> Client"
    - name: list_tenants
      kind: port
      from: tenants_router.list_tenants
      signature: "GET /api/tenants/ -> PaginatedResults[Tenant]"
    - name: create_tenant
      kind: port
      from: tenants_router.create_tenant
      signature: "POST /api/tenants/ -> Tenant"
    - name: list_users
      kind: port
      from: users_router.list_users
      signature: "GET /api/users/ -> PaginatedResults[UserRead]"
    - name: create_user
      kind: port
      from: users_router.create_user
      signature: "POST /api/users/ -> UserRead"
    - name: list_permissions
      kind: port
      from: permissions_router.list_permissions
      signature: "GET /api/permissions/ -> PaginatedResults[Permission]"
    - name: list_roles
      kind: port
      from: roles_router.list_roles
      signature: "GET /api/roles/ -> PaginatedResults[Role]"
    - name: list_oauth_providers
      kind: port
      from: oauth_providers_router.list_oauth_providers
      signature: "GET /api/oauth-providers/ -> PaginatedResults[OAuthProvider]"
    - name: list_email_templates
      kind: port
      from: email_templates_router.list_email_templates
      signature: "GET /api/email-templates/ -> PaginatedResults[EmailTemplate]"
    - name: list_user_fields
      kind: port
      from: user_fields_router.list_user_fields
      signature: "GET /api/user-fields/ -> PaginatedResults[UserField]"
    - name: list_webhooks
      kind: port
      from: webhooks_router.list_webhooks
      signature: "GET /api/webhooks/ -> PaginatedResults[Webhook]"
    - name: create_access_token
      kind: port
      from: users_router.create_access_token
      signature: "POST /api/users/{id}/access-token -> AccessTokenResponse"

verification:
  - node: api_app
    backend: pytest
    tests: tests/test_app.py
  - node: clients_router
    backend: pytest
    tests: tests/test_api/test_clients.py
  - node: tenants_router
    backend: pytest
    tests: tests/test_api/test_tenants.py
  - node: users_router
