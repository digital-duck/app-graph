tech_profile: python_fastapi
port: ${{ settings.BACKEND_FASTAPI_PORT }}
graph: todo_backend
version: "2.1"
domain_type: software
domain: software/backend/fastapi
description: |
  FastAPI backend: persistent task management REST API backed by SQLAlchemy/SQLite.
  Supports full CRUD on tasks with description, date, and completion status.
capstone: task_routes

blueprint:
  id: todo_backend
  schema_version: "2.2"
  domain_type: software
  provenance: reverse_engineered
  parent_blueprint: null
  lineage: []

form:
  primitives:
    python:
      defines: "Python 3.x runtime and standard library"
      tier: 0
      kind: config
    fastapi:
      defines: "FastAPI web framework including Depends, HTTPException, CORSMiddleware"
      tier: 0
      kind: config
    sqlalchemy:
      defines: "SQLAlchemy ORM and core (Column, Integer, String, Boolean, DateTime, Session)"
      tier: 0
      kind: config
    pydantic:
      defines: "Pydantic v1 BaseModel for schema validation"
      tier: 0
      kind: config

  nodes:
    database_config:
      kind: module
      defines: "SQLAlchemy engine, SessionLocal factory, and declarative Base"
      composed_of: [python, sqlalchemy]
      tier: 1
      spec:
        interface: |
          SQLALCHEMY_DATABASE_URL: str  (sqlite:///./tasks.db)
          engine: Engine
          SessionLocal: sessionmaker
          Base: DeclarativeMeta
          get_db() -> Generator[Session, None, None]
        contract: |
          engine is created with connect_args={"check_same_thread": False} for SQLite.
          SessionLocal is configured with autocommit=False, autoflush=False.
          get_db() yields a Session and closes it in a finally block.
          Base is the shared declarative base imported by all ORM models.
      verification:
        node: |
          - SessionLocal() produces a valid Session object
          - get_db() yields exactly one Session then closes it
          - Base.metadata is accessible and empty before model imports
      docs: |
        - Single source of truth for DB connection; imported by models and main

    schemas:
      kind: module
      defines: "Pydantic schemas for Task request/response validation"
      composed_of: [python, pydantic]
      tier: 1
      spec:
        interface: |
          class TaskBase(BaseModel):
              description: str
              date: datetime
              is_completed: bool

          class TaskCreate(TaskBase): pass

          class TaskUpdate(TaskBase): pass

          class Task(TaskBase):
              id: int
              class Config:
                  orm_mode = True
        contract: |
          TaskCreate and TaskUpdate inherit all fields from TaskBase with no additions.
          Task adds an integer id and enables orm_mode so SQLAlchemy model instances
          can be returned directly from route handlers.
          All datetime fields are serialized as ISO-8601.
      verification:
        node: |
          - TaskCreate validates required fields description, date, is_completed
          - Task.from_orm() succeeds given a mock ORM object with all fields
          - Missing any TaskBase field raises a ValidationError
      docs: |
        - No database imports; pure Pydantic layer

    orm_models:
      kind: module
      defines: "SQLAlchemy ORM model for the tasks table"
      composed_of: [sqlalchemy, database_config]
      tier: 2
      spec:
        interface: |
          class Task(Base):
              __tablename__ = "tasks"
              id: int  (Integer, primary_key, index)
              description: str  (String, index)
              date: datetime  (DateTime, index)
              is_completed: bool  (Boolean, index)
        contract: |
          Inherits from database_config.Base so that
          Base.metadata.create_all(bind=engine) creates the tasks table.
          All columns are indexed. No relationships or foreign keys.
      verification:
        node: |
          - Base.metadata.tables contains "tasks" after import
          - Task columns match (id, description, date, is_completed)
          - create_all on an in-memory SQLite engine succeeds without error
      docs: |
        - Column names intentionally match the Pydantic schema field names

    crud:
      kind: module
      defines: "Database CRUD functions for Task: get, list, create, update, delete"
      composed_of: [sqlalchemy, orm_models, schemas]
      tier: 3
      spec:
        interface: |
          get_task(db: Session, task_id: int) -> orm_models.Task | None
          get_tasks(db: Session, skip: int = 0, limit: int = 100) -> list[orm_models.Task]
          create_task(db: Session, task: schemas.TaskCreate) -> orm_models.Task
          update_task(db: Session, task_id: int, task: schemas.TaskUpdate) -> orm_models.Task
          delete_task(db: Session, task_id: int) -> None
        contract: |
          get_task returns None when the id does not exist.
          get_tasks applies skip/limit pagination via SQLAlchemy offset/limit.
          create_task commits and refreshes the new row before returning it.
          update_task patches description, date, and is_completed then commits;
            caller must verify existence beforehand (route layer raises 404).
          delete_task commits the deletion; caller must verify existence beforehand.
      verification:
        node: |
          - create_task inserts a row and returns it with an auto-assigned id
          - get_tasks returns all rows respecting skip and limit
          - get_task returns None for a non-existent id
          - update_task changes persisted fields without creating a new row
          - delete_task removes the row; subsequent get_task returns None
      docs: |
        - No HTTP concerns; all 404 logic lives in the route layer

    task_routes:
      kind: module
      defines: "FastAPI application with CORS and all task REST endpoints"
      composed_of: [fastapi, crud, schemas, database_config]
      tier: 4
      ports:
        root:
          signature: "GET / -> {message: str}"
          kind: call
          direction: out
        list_tasks:
          signature: "GET /tasks/?skip=int&limit=int -> List[schemas.Task]"
          kind: call
          direction: out
        get_task:
          signature: "GET /task/{task_id} -> schemas.Task"
          kind: call
          direction: out
        create_task:
          signature: "POST /tasks/ body:TaskCreate -> schemas.Task"
          kind: call
          direction: out
        update_task:
          signature: "PUT /task/{task_id} body:TaskUpdate -> 200"
          kind: call
          direction: out
        delete_task:
          signature: "DELETE /task/{task_id} -> 200"
          kind: call
          direction: out
      spec:
        interface: |
          GET  /                                 -> {"message": "Hello World"}
          GET  /tasks/?skip=0&limit=100          -> List[Task]
          GET  /task/{task_id}                   -> Task          (404 if missing)
          POST /tasks/          body: TaskCreate -> Task
          PUT  /task/{task_id}  body: TaskUpdate -> 200           (404 if missing)
          DELETE /task/{task_id}                 -> 200           (404 if missing)
        contract: |
          CORS allow_origins is built from FRONTEND_VITE_PORT imported from
          ./config (generated from settings.yaml) as f"http://localhost:{FRONTEND_VITE_PORT}"
          — never a hardcoded port literal — with all methods and headers
          and credentials=True.
          DB session is injected via Depends(get_db) from database_config.
          Routes delegate all persistence to crud functions; no direct ORM calls
          inside route handlers.
          GET /task, PUT /task, DELETE /task raise HTTPException(404) when
          crud.get_task returns None.
          models.Base.metadata.create_all(bind=engine) is called at startup.
      verification:
        node: |
          - GET / returns 200 with {"message": "Hello World"}
          - POST /tasks/ with valid body returns 200 and a Task with assigned id
          - GET /tasks/ returns a list of all created tasks
          - GET /task/{id} returns the correct task by id
          - GET /task/9999 returns 404
          - PUT /task/{id} with valid body returns 200 and persists changes
          - DELETE /task/{id} returns 200 and subsequent GET returns 404
      docs: |
        - Entry point for the application; run with uvicorn task_routes:app

function:
  exports:
    - name: root
      kind: port
      from: task_routes.root
      signature: "GET / -> {message: str}"
    - name: list_tasks
      kind: port
      from: task_routes.list_tasks
      signature: "GET /tasks/?skip=int&limit=int -> List[Task]"
    - name: get_task
      kind: port
      from: task_routes.get_task
      signature: "GET /task/{task_id} -> Task"
    - name: create_task
      kind: port
      from: task_routes.create_task
      signature: "POST /tasks/ -> Task"
    - name: update_task
      kind: port
      from: task_routes.update_task
      signature: "PUT /task/{task_id} -> 200"
    - name: delete_task
      kind: port
      from: task_routes.delete_task
      signature: "DELETE /task/{task_id} -> 200"

verification:
  - node: task_routes
    backend: pytest
    tests: tests/test_routes.py