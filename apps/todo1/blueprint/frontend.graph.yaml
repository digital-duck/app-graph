tech_profile: vue_typescript
port: ${{ settings.FRONTEND_VITE_PORT }}
graph: todo_frontend
version: "2.1"
domain_type: software
domain: software/frontend/vue
target_languages: [typescript]
description: |
  Vue 3 + TypeScript frontend for a Todo application.
  Renders a task list with create, complete, delete, and date-range filter features,
  backed by a FastAPI REST API at localhost:8090. Includes a Chart.js statistics modal.
capstone: main_ts

blueprint:
  id: todo_frontend
  schema_version: "2.2"
  domain_type: software
  provenance: reverse_engineered
  parent_blueprint: null
  lineage: []

form:
  primitives:
    typescript:
      defines: "TypeScript language runtime and type system"
      tier: 0
      kind: config
    vue3:
      defines: "Vue 3 framework with Options API and Single-File Component support"
      tier: 0
      kind: config
    chartjs:
      defines: "Chart.js 3 charting library with all registerables"
      tier: 0
      kind: config

  nodes:
    api_types:
      kind: module
      defines: "TypeScript interfaces for Task domain objects exchanged with the backend"
      composed_of: [typescript]
      tier: 1
      spec:
        interface: |
          interface TaskBase { description: string; date: string; is_completed: boolean }
          interface TaskCreate extends TaskBase {}
          interface TaskUpdate extends TaskBase {}
          interface Task extends TaskBase { id: number }
          interface ClientTask extends Task { isCompleted: boolean; isVisible: boolean; date: Date }
        contract: |
          Pure type declarations — no runtime code.
          ClientTask extends Task with three client-side convenience fields:
            isCompleted mirrors is_completed for template bindings,
            isVisible drives filter visibility,
            date is a JS Date object (backend sends ISO string).
      verification:
        node: |
          - All fields match backend schema (description: string, date, is_completed: boolean)
          - Task has id: number
          - ClientTask adds isCompleted, isVisible, and a JS Date for date
      docs: |
        - Single source of truth for all backend-facing types

    api_client:
      kind: module
      defines: "Fetch-based functions for all backend REST calls"
      composed_of: [typescript, api_types]
      tier: 2
      ports:
        get_tasks:
          signature: "GET /tasks/ -> Promise<Task[]>"
          kind: call
          direction: out
        create_task:
          signature: "POST /tasks/ body: TaskCreate -> Promise<Task>"
          kind: call
          direction: out
        delete_task:
          signature: "DELETE /task/{id} -> Promise<void>"
          kind: call
          direction: out
        update_task:
          signature: "PUT /task/{id} body: TaskUpdate -> Promise<void>"
          kind: call
          direction: out
      spec:
        interface: |
          import { BACKEND_FASTAPI_PORT } from './config'
          const BASE_URL = `http://localhost:${BACKEND_FASTAPI_PORT}`

          getTasks(): Promise<Task[]>              // GET  ${BASE_URL}/tasks/
          createTask(payload: TaskCreate): Promise<Task>   // POST ${BASE_URL}/tasks/
          deleteTask(id: number): Promise<void>            // DELETE ${BASE_URL}/task/${id}
          updateTask(id: number, payload: TaskUpdate): Promise<void>  // PUT ${BASE_URL}/task/${id}
        contract: |
          All functions use fetch() with JSON Content-Type header.
          BASE_URL is built from BACKEND_FASTAPI_PORT imported from ./config (generated from
          settings.yaml) — never a hardcoded port literal.
          getTasks/createTask hit the plural collection path /tasks/ (trailing slash).
          deleteTask/updateTask hit the singular item path /task/{id} — NOT /tasks/{id}.
          Errors propagate as rejected promises — no internal catch blocks.
          deleteTask and updateTask return void (backend returns no body of interest).
      verification:
        node: |
          - getTasks calls GET /tasks/ and returns parsed JSON array typed as Task[]
          - createTask calls POST /tasks/ with JSON-serialised TaskCreate body
          - deleteTask calls DELETE /task/{id}
          - updateTask calls PUT /task/{id} with JSON-serialised TaskUpdate body
      docs: |
        - Centralises all network calls; no component calls fetch() directly

    chart_data:
      kind: module
      defines: "Static Chart.js configuration object for task statistics doughnut chart"
      composed_of: [chartjs]
      tier: 2
      spec:
        interface: |
          export const chartData: import('chart.js').ChartConfiguration
        contract: |
          Exports a single Chart.js ChartConfiguration with type 'doughnut'.
          Dataset has two labels: 'Active' and 'Completed' with placeholder zero data values.
          ToDoCharts.vue will update data values before rendering.
          backgroundColor: ['#3273dc', '#48c774'].
      verification:
        node: |
          - Exports a valid ChartConfiguration object
          - type field is 'doughnut'
          - data.labels has exactly ['Active', 'Completed']
      docs: |
        - Kept separate so chart configuration can change without touching the component

    todo_charts:
      kind: component
      defines: "ToDoCharts.vue — Bulma modal overlay rendering a Chart.js doughnut of task statistics"
      composed_of: [vue3, chartjs, chart_data]
      tier: 3
      spec:
        interface: |
          props:  { modalState: boolean }
          emits:  { closeModal: () => void }
          Template: Bulma .modal div whose 'is-active' class is bound to modalState.
            Contains .modal-background (click -> closeModal), .modal-card with a <canvas id="myChart">.
          mounted(): instantiates new Chart(ctx, chartData) on the canvas element.
        contract: |
          Modal visibility is driven exclusively by the modalState prop.
          Chart is created once in mounted() using the imported chartData config.
          Both the background click and the header delete button emit closeModal.
          Component never manages its own open/close boolean.
      verification:
        node: |
          - Modal has class 'is-active' when and only when modalState is true
          - Clicking modal-background emits closeModal
          - Clicking header delete button emits closeModal
          - A Chart instance is created on mounted using chartData
      docs: |
        - Receives modalState from parent ToDoFilter; never self-manages open state

    todo_filter:
      kind: component
      defines: "ToDoFilter.vue — date-range filter tag bar with chart modal trigger"
      composed_of: [vue3, todo_charts]
      tier: 4
      spec:
        interface: |
          emits: { 'tag-toggled': (disabledNames: string[]) => void }
          data: {
            tags: Array<{ name: string; color: string; isEnable: boolean }>,
            modalState: boolean
          }
          Template: Bulma .columns.box row.
            Left column: v-for tag spans with toggleTag(index) click handler.
            Right column: chart icon button calling toggleModal.
            ToDoCharts component bound to modalState, listening for close-modal.
          Tags (in order): Today (is-primary), Yesterday (is-warning), Earlier (is-danger), Completed (is-info).
        contract: |
          toggleTag(index) XORs tag.isEnable with ^= true, collects disabled tag names,
            emits 'tag-toggled' with that array.
          toggleModal() XORs modalState with ^= true.
          close-modal event from ToDoCharts calls toggleModal to close.
          Each tag gets class 'is-light' when not enabled.
      verification:
        node: |
          - Four tags render with correct Bulma colour classes
          - Active tag has no 'is-light'; disabled tag has 'is-light'
          - Clicking a tag emits 'tag-toggled' with updated disabled names array
          - Chart button opens ToDoCharts modal; closeModal closes it
      docs: |
        - Purely presentational; does not hold or filter the task list itself

    todo_list:
      kind: component
      defines: "ToDoList.vue — task list separating active and completed tasks with delete and complete actions"
      composed_of: [vue3, api_client, api_types, todo_filter]
      tier: 5
      spec:
        interface: |
          props:   { tasks: Map<number, ClientTask> }
          exposes: { taskUpdate(): void }
          data: {
            today: Date,
            activeTasks: Map<number, ClientTask>,
            completedTasks: Map<number, ClientTask>
          }
          Template: outer div hidden when both Maps are empty.
            Embeds ToDoFilter; listens for tag-toggled -> onTagToggled.
            Two <ul> sections: active tasks (complete + delete buttons), completed tasks (delete button only).
            Active task label: isToday -> 'Today' tag, isYesterday -> 'Yesterday' tag, isEarlier -> 'Earlier' tag.
            Complete button hidden when task.isCompleted.
        contract: |
          taskUpdate() iterates props.tasks; entries where isCompleted=false go to activeTasks,
            entries where isCompleted=true go to completedTasks.
          deleteTask(id): calls api_client.deleteTask(id), then tasks.delete(id), then taskUpdate().
          completeTask(id): calls api_client.updateTask(id, { ...task, is_completed: true }),
            sets task.isCompleted = true on the ClientTask, calls taskUpdate().
          onTagToggled(disabledNames): for each task in tasks, sets task.isVisible = true if its
            date tag is not in disabledNames, false otherwise. Completed tasks respond to 'Completed' tag.
          isToday(date): date is within the current calendar day.
          isYesterday(date): date is within the previous calendar day.
          isEarlier(date): date is before yesterday.
      verification:
        node: |
          - taskUpdate() correctly partitions tasks into active and completed Maps
          - Active tasks show both complete and delete buttons
          - Completed tasks show only delete button
          - deleteTask removes task from map and refreshes view
          - completeTask moves task from active to completed after API call
          - Tag toggling sets isVisible correctly on tasks
      docs: |
        - taskUpdate() is called via $refs from ToDoForm after any mutation

    todo_form:
      kind: component
      defines: "ToDoForm.vue — task creation form and top-level owner of the tasks Map"
      composed_of: [vue3, api_client, api_types, todo_list]
      tier: 6
      spec:
        interface: |
          data: {
            taskDescription: string,
            tasks: Map<number, ClientTask>
          }
          Template: <form @submit.prevent="onSubmit"> with text input (v-model taskDescription) and ADD button.
            ToDoList embedded with ref="todoList" and :tasks="tasks" prop.
          onSubmit(): creates a new task via api_client.createTask, normalises response to ClientTask,
            adds to tasks map, calls $refs.todoList.taskUpdate(), clears taskDescription.
          getAllTasks(): fetches all tasks via api_client.getTasks, normalises each to ClientTask,
            populates tasks map, calls $refs.todoList.taskUpdate().
          mounted(): calls getAllTasks().
        contract: |
          onSubmit() is a no-op when taskDescription is empty string.
          New task payload: { description: taskDescription, date: new Date().toISOString(), is_completed: false }.
          Normalisation from Task to ClientTask: isCompleted = is_completed, isVisible = true, date = new Date(date).
          tasks Map is the sole owner; ToDoList receives it as a prop and mutates entries in place.
          taskDescription is cleared to '' after a successful POST.
      verification:
        node: |
          - Empty description submit does not call the API
          - Successful POST adds normalised ClientTask to map and calls taskUpdate()
          - getAllTasks populates map on mount with normalised ClientTask entries
          - taskDescription resets to '' after successful submit
      docs: |
        - Single owner of the tasks Map; child components receive it as prop or via $refs

    todo_root:
      kind: component
      defines: "ToDo.vue — page-level layout wrapper that positions ToDoForm"
      composed_of: [vue3, todo_form]
      tier: 7
      spec:
        interface: |
          No props, no emits, no local state.
          Template: <div class="column is-half-desktop mt-5"><ToDoForm /></div>
        contract: |
          Thin layout shell only; all logic lives in descendant components.
          Suitable for direct use as a route component in Vue Router.
      verification:
        node: |
          - Renders ToDoForm inside .column.is-half-desktop.mt-5
          - No additional logic, state, or event handling
      docs: |
        - Exists to provide page-level Bulma column layout

    App_vue:
      kind: component
      defines: "App.vue — root Vue SFC that mounts ToDo as the sole child component"
      composed_of: [vue3, todo_root]
      tier: 8
      spec:
        interface: |
          <template><ToDo /></template> — imports and registers the ToDo component, no other markup.
        contract: |
          No Vuex/Pinia store; all state is owned within the component hierarchy.
          No Vue Router; single-page application with ToDo as the sole view.
      verification:
        node: |
          - valid .vue SFC with <template> and <script setup lang="ts">
          - renders exactly one component
          - imports ToDo from ./components/ToDo.vue and uses it in template
      docs: |
        - Thin shell — exists only to provide a named root component for createApp()

    main_ts:
      kind: module
      defines: "main.ts — Vite entry point that creates the Vue app instance and mounts it"
      composed_of: [vue3, App_vue]
      tier: 9
      spec:
        interface: |
          import { createApp } from 'vue'; import App from './App.vue'; createApp(App).mount('#app')
        contract: |
          Side-effect only, no exports.
          Backend expected at http://localhost:8090 with CORS allowing localhost:8080.
      verification:
        node: |
          - file contains createApp and .mount()
          - imports App from ./App.vue
          - mount target '#app' matches index.html div id
          - App mounts to #app without console errors
          - Task list populates from the API on mount
      docs: |
        - Vite project entry point; index.html must have <div id="app">

function:
  exports:
    - name: todo_root
      kind: component
      from: todo_root
      signature: "ToDo.vue — no props, renders full todo UI"
    - name: get_tasks
      kind: port
      from: api_client.get_tasks
      signature: "GET /tasks/ -> Promise<Task[]>"
    - name: create_task
      kind: port
      from: api_client.create_task
      signature: "POST /tasks/ body: TaskCreate -> Promise<Task>"
    - name: delete_task
      kind: port
      from: api_client.delete_task
      signature: "DELETE /task/{id} -> Promise<void>"
    - name: update_task
      kind: port
      from: api_client.update_task
      signature: "PUT /task/{id} body: TaskUpdate -> Promise<void>"

verification:
  - node: api_client
    backend: vitest
    tests: tests/apiClient.spec.ts
  - node: todo_list
    backend: vitest
    tests: tests/ToDoList.spec.ts
  - node: todo_form
    backend: vitest
    tests: tests/ToDoForm.spec.ts
  - node: main_ts
    backend: vitest
    tests: tests/app.spec.ts