tech_profile: vue_typescript
port: ${{ settings.FRONTEND_VITE_PORT }}
graph: todo_frontend
version: "2.1"
domain_type: software
domain: software/frontend/vue
target_languages: [typescript]
description: |
  Vue 3 + TypeScript frontend for a JWT-authenticated todo application.
  Users register, log in, and manage daily tasks filtered by date.
  Tasks support inline editing, completion toggling, deletion, and
  drag-and-drop priority reordering. Auth state is persisted in
  localStorage with automatic access-token refresh on 401.
capstone: app_shell

blueprint:
  id: todo_frontend
  schema_version: "2.2"
  domain_type: software
  provenance: reverse-engineered
  parent_blueprint: null
  lineage: []

form:
  primitives:
    vue:
      defines: "Vue 3 framework and Composition API (<script setup>)"
      tier: 0
      kind: config
    typescript:
      defines: "TypeScript language and strict type system"
      tier: 0
      kind: config
    vuetify:
      defines: "Vuetify 3 Material Design component library"
      tier: 0
      kind: config
    pinia:
      defines: "Pinia state management for Vue 3"
      tier: 0
      kind: config
    axios:
      defines: "Axios HTTP client library"
      tier: 0
      kind: config
    vue_router:
      defines: "Vue Router 4 client-side routing"
      tier: 0
      kind: config

  nodes:
    types:
      kind: module
      defines: "Shared TypeScript interfaces matching all backend request/response shapes"
      composed_of: [typescript]
      tier: 1
      spec:
        interface: |
          interface Task {
            id: number
            priority: number
            text: string
            completed: boolean
            created_at: string
          }
          interface CreateTaskPayload {
            text: string
            priority: number
            posted_at: string   // YYYY-MM-DD
          }
          interface UpdateTaskPayload {
            priority?: number
            text?: string
            completed?: boolean
          }
          interface PriorityMap {
            priorities: Record<number, number>  // { taskId: newPriority }
          }
          interface UserCreate {
            name: string
            email: string
            username: string
            password: string
          }
          interface UserDisplay {
            username: string
            email: string
            created_at: string
          }
          interface TokenPair {
            access_token: string
            refresh_token: string
            token_type?: string
          }
        contract: |
          All interfaces match backend API shapes exactly.
          Dates are ISO 8601 strings. No extra fields.
          No `any` types; strict null checks apply throughout.
      verification:
        node: |
          - tsc --strict compiles with zero errors
          - All fields match backend schema definitions
      docs: |
        - src/types/index.ts

    api_client:
      kind: module
      defines: "Axios instance with base URL, JWT request injection, and 401 refresh interceptor"
      composed_of: [axios, typescript, types]
      tier: 2
      spec:
        interface: |
          apiClient: AxiosInstance
            // baseURL: import.meta.env.VITE_API_URL
          // Request interceptor:
          //   reads 'access_token' from localStorage
          //   sets Authorization: Bearer <token> on every request
          // Response interceptor:
          //   on 401: POST /user/jwt/refresh/ with stored 'refresh_token'
          //     on success: update localStorage tokens, retry original request
          //     on failure: clear localStorage, dispatch window CustomEvent('auth:logout')
        contract: |
          Single exported Axios instance used by all API modules.
          Token keys in localStorage: 'access_token', 'refresh_token'.
          Refresh is attempted exactly once per failed request; a second 401 clears tokens.
          auth:logout event consumed by auth_store to clear in-memory state.
      verification:
        node: |
          - Authorization header present on requests when token in localStorage
          - 401 triggers one refresh attempt before clearing storage
          - auth:logout CustomEvent fired on refresh failure
      docs: |
        - src/api/client.ts

    auth_api:
      kind: module
      defines: "Auth endpoint functions: login (JWT create) and token refresh"
      composed_of: [typescript, api_client, types]
      tier: 3
      spec:
        interface: |
          login(username: string, password: string): Promise<TokenPair>
            // POST /user/jwt/create/
            // body: application/x-www-form-urlencoded  { username, password }
          refreshToken(token: string): Promise<TokenPair>
            // POST /user/jwt/refresh/
            // body: JSON { refresh_token: token }
        contract: |
          login MUST send form-encoded body (OAuth2PasswordRequestForm requirement).
          refreshToken sends JSON body.
          Both return TokenPair; throw AxiosError on 401/400.
      verification:
        node: |
          - login sets Content-Type application/x-www-form-urlencoded
          - refreshToken sets Content-Type application/json
      docs: |
        - src/api/authApi.ts

    user_api:
      kind: module
      defines: "User endpoint functions: registration"
      composed_of: [typescript, api_client, types]
      tier: 3
      spec:
        interface: |
          registerUser(payload: UserCreate): Promise<UserDisplay>
            // POST /users/register/
            // body: JSON UserCreate
        contract: |
          Returns UserDisplay on 200.
          Throws AxiosError with response.data.detail on 409 (duplicate username or email).
      verification:
        node: |
          - POST /users/register/ with correct JSON body
          - 409 error detail string accessible via error.response.data.detail
      docs: |
        - src/api/userApi.ts

    task_api:
      kind: module
      defines: "Task endpoint functions: CRUD and bulk priority reorder"
      composed_of: [typescript, api_client, types]
      tier: 3
      spec:
        interface: |
          createTask(payload: CreateTaskPayload): Promise<Task>
            // POST /task/
          getTasks(date: string): Promise<Task[]>
            // GET /task/?selected_date=YYYY-MM-DD
          updateTask(taskId: number, payload: UpdateTaskPayload): Promise<Task>
            // PATCH /task/{taskId}/
          deleteTask(taskId: number): Promise<void>
            // DELETE /task/{taskId}/  expects 204
          updateTaskOrder(priorities: Record<number, number>): Promise<void>
            // PATCH /task/update-order/  body: { priorities }
        contract: |
          All calls require valid access token (injected by api_client).
          getTasks passes date as query param named selected_date.
          deleteTask treats 204 as success (no body).
          updateTaskOrder sends full id->priority map in one request.
      verification:
        node: |
          - getTasks URL contains ?selected_date= query param
          - deleteTask resolves on 204 with no body parse
          - updateTaskOrder sends { priorities: { [id]: priority } }
      docs: |
        - src/api/taskApi.ts

    auth_store:
      kind: module
      defines: "Pinia store: auth tokens, username, login/logout/initFromStorage actions"
      composed_of: [pinia, typescript, auth_api, types]
      tier: 4
      spec:
        interface: |
          // State
          accessToken: string | null
          refreshToken: string | null
          username: string | null
          // Getters
          isAuthenticated: boolean   // true when accessToken is non-null
          // Actions
          login(username: string, password: string): Promise<void>
            // calls auth_api.login, stores TokenPair to state + localStorage
            // extracts username from JWT sub claim (base64 decode middle segment)
          logout(): void
            // clears state and localStorage, calls router.push('/login')
          initFromStorage(): void
            // reads tokens from localStorage on app mount, restores state
            // extracts username from stored access_token if present
        contract: |
          localStorage keys: 'access_token', 'refresh_token'.
          Username decoded from JWT payload sub field; no external JWT library needed.
          logout() always clears regardless of API state.
          Listens for window 'auth:logout' event from api_client; calls logout() handler.
          isAuthenticated is a computed getter: !!accessToken.
      verification:
        node: |
          - isAuthenticated false after logout()
          - login() sets both localStorage keys
          - initFromStorage() restores isAuthenticated when valid tokens in localStorage
          - auth:logout window event triggers logout()
      docs: |
        - src/store/authStore.ts
        - Exported as useAuthStore()

    router:
      kind: module
      defines: "Vue Router config with named routes and authentication navigation guard"
      composed_of: [vue_router, typescript, auth_store]
      tier: 5
      spec:
        interface: |
          routes:
            { name: 'Home',         path: '/',         component: TaskView,     meta: { requiresAuth: true } }
            { name: 'Authorization', path: '/login',   component: LoginView }
            { name: 'Registration', path: '/register', component: RegisterView }
          beforeEach guard:
            if to.meta.requiresAuth && !authStore.isAuthenticated  -> next('/login')
            if (to.path === '/login' || '/register') && isAuthenticated -> next('/')
            else next()
        contract: |
          Uses createWebHistory().
          Unauthenticated access to any requiresAuth route always redirects to /login.
          Authenticated users hitting /login or /register are redirected to /.
          Components imported lazily with defineAsyncComponent or dynamic import.
      verification:
        node: |
          - Unauthenticated navigation to / redirects to /login
          - Authenticated navigation to /login redirects to /
      docs: |
        - src/router/index.ts

    layout_components:
      kind: module
      defines: "Shared layout shell components: TheHeader, TheFooter, TheSpinner, PostIt"
      composed_of: [vue, vuetify, typescript, auth_store, router]
      tier: 6
      spec:
        interface: |
          TheHeader:
            // Props: none
            // Shows logo img + router-link 'Home' (app name)
            // v-if !isAuthenticated: Register button -> router.push('Registration')
            // v-if !isAuthenticated: Log In button -> router.push('Authorization')
            // v-else: Logout button -> authStore.logout()
          TheFooter:
            // Props: none
            // Displays copyright + new Date().getFullYear()
          TheSpinner:
            // Props: none
            // CSS keyframe spin animation div; parent controls v-if
          PostIt:
            // Props: none
            // Slot wrapper with yellow (#ffffd4) post-it card styling and fold shadow
        contract: |
          TheHeader uses useAuthStore() and useRouter() internally via <script setup>.
          All components use <script setup lang="ts">.
          PostIt exposes only a default slot; no props or emits.
          TheSpinner has no props; visibility is controlled by parent v-if.
      verification:
        node: |
          - TheHeader renders Logout when isAuthenticated, Register+Login when not
          - PostIt slot content renders inside styled container
      docs: |
        - src/components/layout/TheHeader.vue
        - src/components/layout/TheFooter.vue
        - src/components/layout/TheSpinner.vue
        - src/components/layout/PostIt.vue

    task_item:
      kind: module
      defines: "Single task row: completion checkbox, inline text edit, delete button"
      composed_of: [vue, vuetify, typescript, types]
      tier: 6
      spec:
        interface: |
          Props:
            task: Task
          Emits:
            'toggle-complete': [taskId: number, completed: boolean]
            'update-text':     [taskId: number, text: string]
            'delete-task':     [taskId: number]
          // Checkbox: emits toggle-complete with !task.completed
          // Text: displayed as span; click enables v-text-field; blur/Enter emits update-text
          // Delete icon button: emits delete-task
          // Completed style: text-decoration line-through + muted color
        contract: |
          Makes no API calls; all mutations are emitted upward.
          Inline edit only shows text field when editMode ref is true.
          editMode resets to false after update-text is emitted.
      verification:
        node: |
          - toggle-complete emits with inverted completed value
          - delete-task emits correct taskId
          - blur on text field emits update-text and exits edit mode
      docs: |
        - src/components/TaskItem.vue

    task_list:
      kind: module
      defines: "Date-filtered draggable task list with add-task form and all mutation handlers"
      composed_of: [vue, vuetify, typescript, types, task_api, task_item, layout_components]
      tier: 7
      spec:
        interface: |
          // No props
          // State:
          //   tasks: Task[]
          //   selectedDate: Date  (default: today)
          //   loading: boolean
          //   newTaskText: string
          // VueDatePicker bound to selectedDate; on change calls fetchTasks()
          // fetchTasks(): sets loading=true, calls task_api.getTasks(dateStr), updates tasks
          // Add-task form: v-text-field for newTaskText + submit button
          //   on submit: task_api.createTask({ text, priority: tasks.length+1, posted_at })
          //   then fetchTasks()
          // vuedraggable wraps list of TaskItem; on drag end:
          //   rebuild priority map { tasks[i].id: i+1 }
          //   call task_api.updateTaskOrder(map) then fetchTasks()
          // TaskItem emits handled:
          //   toggle-complete -> task_api.updateTask(id, { completed }) then fetchTasks()
          //   update-text    -> task_api.updateTask(id, { text })     then fetchTasks()
          //   delete-task    -> task_api.deleteTask(id)               then fetchTasks()
          // TheSpinner shown while loading
          // Task area wrapped in PostIt component
        contract: |
          selectedDate formatted as YYYY-MM-DD string when passed to task_api.
          After every mutation the full list is re-fetched (no optimistic updates).
          New task priority is tasks.length + 1 before creation.
          Drag-end priority is zero-indexed position + 1 (1-based).
      verification:
        node: |
          - Date change triggers GET with correct selected_date param
          - Drag-end PATCH sends 1-based index priorities for all visible tasks
          - Every mutation (create/update/delete/reorder) followed by fetchTasks()
      docs: |
        - src/components/TaskList.vue

    auth_views:
      kind: module
      defines: "Login and Registration page views"
      composed_of: [vue, vuetify, typescript, auth_store, user_api, router]
      tier: 7
      spec:
        interface: |
          LoginView (path /login, name Authorization):
            // v-form: username v-text-field, password v-text-field (type password)
            // Submit -> authStore.login(username, password)
            //   on success: router.push({ name: 'Home' })
            //   on error: show error.response.data.detail in v-alert
            // Link to Registration page
            // Submit button disabled while loading ref is true
          RegisterView (path /register, name Registration):
            // v-form: name, email, username, password v-text-fields
            // Submit -> user_api.registerUser(payload)
            //   on success: router.push({ name: 'Authorization' })
            //   on error: show error.response.data.detail in v-alert (409 conflict)
            // Link to Login page
            // Submit button disabled while loading ref is true
        contract: |
          Both views use Vuetify v-form with v-text-field and a v-btn submit.
          Error message extracted from AxiosError.response.data.detail string.
          loading ref prevents double-submit.
      verification:
        node: |
          - Successful login navigates to /
          - Successful registration navigates to /login
          - 409 conflict displays detail message in alert
      docs: |
        - src/views/LoginView.vue
        - src/views/RegisterView.vue

    task_view:
      kind: module
      defines: "Main authenticated home view that hosts the task list"
      composed_of: [vue, vuetify, typescript, auth_store, task_list, layout_components]
      tier: 8
      spec:
        interface: |
          // Route: / (name Home, requiresAuth: true)
          // Template: v-container centered
          //   greeting h2 showing authStore.username
          //   <TaskList /> component
          // No direct API calls; all task logic delegated to TaskList
        contract: |
          Renders only when authenticated (router guard enforces this).
          Contains no business logic; purely a layout wrapper for TaskList.
      verification:
        node: |
          - Renders TaskList component in centered container
          - Displays username from authStore.username in greeting
      docs: |
        - src/views/TaskView.vue

    app_shell:
      kind: module
      defines: "Application entry: main.ts plugin wiring and App.vue root layout"
      composed_of: [vue, vuetify, pinia, typescript, router, layout_components, auth_views, task_view, auth_store]
      tier: 9
      spec:
        interface: |
          main.ts:
            createApp(App)
              .use(createPinia())
              .use(vuetify)   // configured: theme colors, md icons, defaults
              .use(router)
              .mount('#app')
            // After mount: useAuthStore().initFromStorage()
          App.vue:
            // Template: CSS grid layout (header / main / footer)
            //   <TheHeader />
            //   <RouterView />
            //   <TheFooter />
            // onMounted: authStore.initFromStorage()
        contract: |
          Pinia must be registered before router so auth_store is available in navigation guards.
          initFromStorage() called in onMounted to restore session before first render.
          App.vue contains no business logic; only structural layout.
          Vuetify configured with custom theme (bisque/warm palette matching existing CSS).
      verification:
        node: |
          - App.vue renders TheHeader, RouterView, TheFooter in grid layout
          - Pinia registered before router
          - initFromStorage() called on app mounted
      docs: |
        - src/main.ts
        - src/App.vue

function:
  exports:
    - name: login_view
      kind: component
      from: auth_views
      signature: "LoginView — /login route, handles JWT login flow"
    - name: register_view
      kind: component
      from: auth_views
      signature: "RegisterView — /register route, handles user registration"
    - name: task_view
      kind: component
      from: task_view
      signature: "TaskView — / route (requiresAuth), hosts full task management UI"
    - name: is_authenticated
      kind: port
      from: auth_store
      signature: "isAuthenticated: boolean — consumed by TheHeader and router guard"

verification:
  - node: auth_store
    backend: vitest
    tests: tests/authStore.spec.ts
  - node: task_list
    backend: vitest
    tests: tests/taskList.spec.ts
  - node: task_item
    backend: vitest
    tests: tests/taskItem.spec.ts
  - node: app_shell
    backend: vitest
    tests: tests/app.spec.ts