domain: software/apps/todo2A
target_languages: [python, typescript]
comment: |
  todo2A is a personal task-management web application where authenticated users
  create, view, edit, reorder, and delete tasks organised by calendar date.
  The backend is a FastAPI/SQLAlchemy async REST API secured with JWT access and
  refresh tokens; the Vue 3/Vuetify frontend calls that API via axios, persists
  authentication state in a Pinia store, and lets users drag tasks into priority
  order with vuedraggable. The two tiers are separately deployed and connected
  through a configured CORS policy.
capstone: manage_todo2A

blueprint:
  id: todo2A_app
  schema_version: "2.2"
  graph_schema_version: "2.1"
  domain_type: integrated
  provenance: reverse
  parent_blueprint: null
  lineage: []

imports:
  - id: backend
    graph: ./backend.graph.yaml
    comment: |
      FastAPI async REST API serving authentication, user, and task endpoints on
      BACKEND_FASTAPI_PORT with CORS open to the frontend origin.
  - id: frontend
    graph: ./frontend.graph.yaml
    comment: |
      Vue 3/Vuetify SPA served by Vite on FRONTEND_VITE_PORT that calls the
      backend REST API via axios using JWT tokens stored in the Pinia auth store.

ports:
  backend: ${{ settings.BACKEND_FASTAPI_PORT }}
  frontend: ${{ settings.FRONTEND_VITE_PORT }}

form:
  nodes:
    app_shell:
      kind: component
      defines: "System integration shell: Vue SPA consuming FastAPI REST API via CORS with JWT auth"
      tier: 1
      depends_on: [backend, frontend]

    readme:
      kind: doc
      defines: "README.md: product-level overview, architecture, setup, and run instructions"
      composed_of: [app_shell]
      tier: 2
      spec:
        interface: |
          Output: README.md at the system root — plain Markdown, not code.
        contract: |
          Title, one-paragraph description, Architecture (backend/frontend ports,
          CORS, JWT flow), Prerequisites, Running the full system (backend then
          frontend), Applications (one line per applications entry below).

function:
  exports:
    - name: manage_todo2A
      kind: port
      from: app_shell.main
      signature: "() -> void"

applications:
  register_user:
    tier: 1
    needs:
      backend: [user_router]
      frontend: [auth_views, auth_store]
    spec:
      user_story: |
        As a new visitor I want to create an account with my name, email,
        username, and password so that I can start managing my tasks.
      contract: |
        Frontend registration form POSTs UserCreate payload to POST /users/register/.
        Backend validates uniqueness of username and email (409 on conflict),
        hashes the password, persists the user, and returns UserDisplay
        (username, email, created_at). Frontend redirects to the login view on
        success and surfaces field-level conflict errors on failure.

  login_user:
    tier: 1
    needs:
      backend: [auth_router]
      frontend: [auth_views, auth_store]
    spec:
      user_story: |
        As a registered user I want to log in with my username and password so
        that I receive a JWT access/refresh token pair and can access my tasks.
      contract: |
        Frontend login form POSTs OAuth2PasswordRequestForm credentials to
        POST /user/jwt/create/. Backend authenticates via UserRepository,
        returns {access_token, refresh_token, token_type}. Auth store persists
        both tokens; header shows Logout button; unauthenticated users are
        redirected back to login when accessing protected views.

  refresh_token:
    tier: 1
    needs:
      backend: [auth_router]
      frontend: [auth_store]
    spec:
      user_story: |
        As a logged-in user whose access token has expired I want a new token
        pair issued transparently so that my session continues without a
        forced re-login.
      contract: |
        Auth store axios interceptor detects 401 responses and POSTs the stored
        refresh_token to POST /user/jwt/refresh/. Backend validates the refresh
        token, checks user existence and active status, and returns a new
        {access_token, refresh_token} pair. Store updates both tokens and
        retries the failed request; on refresh failure it clears tokens and
        redirects to login.

  browse_tasks_by_date:
    tier: 1
    needs:
      backend: [task_router, task_repo]
      frontend: [task_view, task_list]
    spec:
      user_story: |
        As a logged-in user I want to select a calendar date and see all my
        tasks for that day ordered by priority so that I can review my plan.
      contract: |
        Frontend date picker emits a selected_date; home view GETs
        GET /task/?selected_date=YYYY-MM-DD with Bearer token. Backend queries
        tasks filtered by user and posted_at date ordered by priority ascending
        and returns list[DisplayTaskSchema]. Task store replaces its task list;
        each task renders in a PostIt card showing text, completion checkbox,
        and priority handle.

  create_task:
    tier: 1
    needs:
      backend: [task_router, task_repo]
      frontend: [task_view, task_list]
    spec:
      user_story: |
        As a logged-in user I want to type a new task and save it to the
        selected date so that it appears in my list at the correct priority.
      contract: |
        Frontend task-input form POSTs CreateTaskSchema {text, priority,
        posted_at} to POST /task/ with Bearer token. Backend persists the task
        linked to the current user and returns DisplayTaskSchema. Task store
        appends the new task; UI clears the input field and scrolls to the new
        item.

  update_task:
    tier: 1
    needs:
      backend: [task_router, task_repo]
      frontend: [task_view, task_list]
    spec:
      user_story: |
        As a logged-in user I want to edit a task's text or toggle its
        completion status so that my list stays accurate.
      contract: |
        Frontend emits an UpdateTaskSchema patch (priority, text, and/or
        completed — all optional) to PATCH /task/{task_id}/ with Bearer token.
        Backend verifies task ownership (409 if mismatch, 404 if missing),
        applies non-null fields, and returns updated DisplayTaskSchema. Task
        store replaces the task in place; completion toggle visually strikes
        through the task text.

  reorder_tasks:
    tier: 1
    needs:
      backend: [task_router, task_repo]
      frontend: [task_view, task_list]
    spec:
      user_story: |
        As a logged-in user I want to drag tasks into a new order so that the
        priorities are saved and persist on next load.
      contract: |
        Frontend vuedraggable component emits an end-drag event; task store
        recalculates priority values and PATCHes UpdateTaskPrioritiesSchema
        {priorities: {id: priority, ...}} to PATCH /task/update-order/ with
        Bearer token. Backend verifies all task ids belong to the current user
        (409 on mismatch) and bulk-updates priorities. Store reflects the new
        order; no full reload required.

  delete_task:
    tier: 1
    needs:
      backend: [task_router, task_repo]
      frontend: [task_view, task_list]
    spec:
      user_story: |
        As a logged-in user I want to delete a task I no longer need so that
        it is permanently removed from my list.
      contract: |
        Frontend delete action sends DELETE /task/{task_id}/ with Bearer token.
        Backend verifies the task belongs to the current user and deletes it,
        returning 204 No Content (404 if not found). Task store removes the
        item from its list; the PostIt card animates out with no page reload.

  manage_todo2A:
    tier: 2
    capstone: true
    needs:
      backend: [auth_router, user_router, task_router, task_repo, user_repo]
      frontend: [auth_views, task_view, auth_store, task_list]
      applications:
        - register_user
        - login_user
        - refresh_token
        - browse_tasks_by_date
        - create_task
        - update_task
        - reorder_tasks
        - delete_task
    spec:
      user_story: |
        As a user I want a complete personal task manager where I can register,
        log in, and then create, view, edit, reorder, and delete tasks by date
        so that I stay organised day to day.
      contract: |
        All eight sub-applications function end-to-end against the live system:
        registration and login produce valid JWT pairs; the token refresh cycle
        extends sessions transparently; date-browsing returns correct ordered
        task lists; task creation, editing, reordering, and deletion are
        immediately reflected in the UI and confirmed by subsequent GET
        responses. CORS headers are present on every backend response. The
        frontend loads without console errors on all supported routes.

verification:
  - node: app_shell
    tool: integrate_system.spl
    checks:
      - CORS headers present on all backend responses
      - frontend loads without console errors on all routes
      - every application passes acceptance tests against the live system