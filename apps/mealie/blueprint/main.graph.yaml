# ── Unified Duality Graph Schema v2.1 — Integrated Profile (Graph of Graphs) ─
# Migrated from graph-driven-workflow/apps/SPL/mealie/system.yaml
domain: software/apps/mealie
target_languages: [python, typescript]
comment: |
  Recipe manager (scoped core): Vue.js frontend + FastAPI backend + SQLite
  storage. Recipe CRUD + organizers (tags, categories, tools) with a
  many-to-many relationship, nested sub-entities replaced wholesale on
  update, and generic pagination. Largest app ported into graph-code/apps/
  so far — save for last, after the todo/dispatch/expense/fastapi/kanban
  pattern was well-worn on smaller apps.
capstone: manage_recipe_collection

blueprint:
  id: mealie_recipe_manager
  schema_version: "2.3"
  graph_schema_version: "2.1"
  domain_type: integrated
  provenance: authored
  parent_blueprint: null
  lineage: []

imports:
  - id: backend
    graph: ./backend.graph.yaml
    comment: |
      FastAPI REST API at :8003, OpenAPI schema at /docs, CORS enabled for
      :5176. Mandatory — the frontend cannot function without it.
  - id: frontend
    graph: ./frontend.graph.yaml
    comment: |
      Vue.js SPA served by Vite at :5176. Already imports backend.graph.yaml
      itself to verify recipe_api_client's call contracts.

ports:
  backend: ${{ settings.BACKEND_FASTAPI_PORT }}
  frontend: ${{ settings.FRONTEND_VITE_PORT }}

form:
  nodes:
    mealie_app_shell:
      kind: component
      defines: "System integration shell: frontend at :5176 consuming backend REST API at :8003 via CORS"
      tier: 1
      depends_on: [backend, frontend]

    readme:
      kind: doc
      defines: "README.md: product-level overview, setup, and run instructions for the whole recipe manager"
      composed_of: [mealie_app_shell]
      tier: 2
      spec:
        interface: |
          Output: README.md at the system root (the same directory as this graph.yaml, or
          --output_dir when integrate_system.spl was run with one) — plain Markdown, not code.
          CRITICAL: output ONLY the Markdown document itself — no preamble narration, no tool-call
          syntax (see apps/dispatch/blueprint/backend.graph.yaml's readme node for the real
          incident this instruction guards against).
        contract: |
          Must include, as Markdown sections:
          - Title + one-paragraph description of the whole app
          - Architecture: frontend (:5176) calls backend (:8003) over REST, CORS enabled — one
            sentence, link to each component's own README.md
          - Running the full system: build it (`spl3 run spl/build_app.spl ...`), then start
            backend and frontend together
          - Applications: one line per application from this graph's `applications:` block
        content_outline: |
          # <App name>
          One paragraph description.
          ## Architecture
          ## Running the full system
          ## Applications
      verification:
        node: |
          - README.md exists at the system root
          - contains headings for architecture, running the full system, and applications
      docs: |
        - Generated last by integrate_system.spl, after both components are built and
          acceptance tests have run — so it can report real pass/fail results

function:
  exports:
    - name: manage_recipe_collection
      kind: port
      from: mealie_app_shell.main
      signature: "() -> void"
      comment: |
        Single entry point. Serves the frontend, starts the backend, and wires
        CORS between them. The system capstone.

applications:

  browse_recipes:
    defines: |
      - User opens the app and sees all recipes in a paginated grid
    needs:
      backend: [api_routes]
      frontend: [RecipeDashboard]
    tier: 1
    spec:
      user_story: |
        - As a user I can browse my recipe collection on page load
      contract: |
        - GET /recipes returns PaginationBase[RecipeSummary]
        - frontend renders one RecipeCard per item
        - empty state shown when no recipes
    verification: |
      - e2e: mount app -> GET /recipes called -> cards rendered
      - empty DB -> empty state shown
    docs: |
      - Entry point
      - validates recipe list + card rendering

  filter_by_organizer:
    defines: |
      - User selects a tag or category
      - recipe grid updates to show only matching recipes
    needs:
      backend: [api_routes]
      frontend: [RecipeDashboard]
    tier: 1
    spec:
      user_story: |
        - As a user I can narrow my recipe collection by tag or category
      contract: |
        - OrganizerFilter change -> GET /recipes?tags={slug} or ?categories={slug}
        - only matching recipes returned
        - clear filter restores full list
    verification: |
      - e2e: create tag + 2 recipes (1 tagged, 1 not) -> filter by tag -> 1 card shown
    docs: |
      - Validates query parameter filtering
      - exercises OrganizerFilter v-model pattern

  view_recipe:
    defines: |
      - User clicks a recipe card and sees the full recipe detail (ingredients, steps, notes)
    needs:
      backend: [api_routes]
      frontend: [RecipeDashboard]
    tier: 1
    spec:
      user_story: |
        - As a user I can view the full recipe including ingredients and instructions
      contract: |
        - click RecipeCard -> RecipeDetailView shown -> GET /recipes/{slug} -> full Recipe rendered
    verification: |
      - e2e: create recipe -> click card -> detail view shows ingredients + steps
    docs: |
      - Validates slug-based lookup
      - exercises RecipeDetailView + RecipeIngredientList

  create_recipe:
    defines: |
      - User fills the create form and submits
      - new recipe appears in the grid
    needs:
      backend: [api_routes]
      frontend: [RecipeDashboard]
    tier: 1
    spec:
      user_story: |
        - As a user I can create a new recipe by providing a name
      contract: |
        - POST /recipes -> 201 + slug (str)
        - recipe appears in RecipeList
        - empty name rejected (422)
    verification: |
      - e2e: open form -> fill name -> submit -> POST fires -> recipe card appears
    docs: |
      - Validates slug generation
      - RecipeForm create mode

  update_recipe:
    defines: |
      - User views a recipe, clicks edit, updates fields, and saves
    needs:
      backend: [api_routes]
      frontend: [RecipeDashboard]
    tier: 1
    spec:
      user_story: |
        - As a user I can update an existing recipe's name, ingredients, and steps
      contract: |
        - RecipeForm edit mode -> PUT /recipes/{slug} -> updated Recipe
        - if name changes, slug changes accordingly
    verification: |
      - e2e: create -> view -> edit name -> save -> verify slug changed
    docs: |
      - Validates slug update on rename
      - RecipeForm dual-mode form

  delete_recipe:
    defines: |
      - User clicks delete on a recipe card
      - recipe is permanently removed
    needs:
      backend: [api_routes]
      frontend: [RecipeDashboard]
    tier: 1
    spec:
      user_story: |
        - As a user I can delete a recipe I no longer need
      contract: |
        - DELETE /recipes/{slug} -> 200 with deleted Recipe object
        - card removed
        - reload confirms absence
    verification: |
      - e2e: create -> delete -> grid shows empty state
      - GET /recipes/{slug} returns 404
    docs: |
      - Note: reference returns 200 + Recipe (not 204) — GDW matches reference contract

  manage_organizers:
    defines: |
      - User can create, list, and delete tags, categories, and tools
    needs:
      backend: [api_routes]
      frontend: [RecipeDashboard]
    tier: 1
    spec:
      user_story: |
        - As a user I can manage my organizer vocabulary (tags, categories, tools)
      contract: |
        - POST /tags -> 201 + RecipeTag
        - DELETE /tags/{slug} -> 200
        - same for /categories, /tools
    verification: |
      - e2e: create tag -> assign to recipe -> filter recipes?tags=slug -> 1 result
    docs: |
      - Validates many-to-many relationship end-to-end

  manage_recipe_collection:
    defines: |
      - User can build and manage their full recipe collection — the golden path
    needs:
      applications: [browse_recipes, filter_by_organizer, view_recipe, create_recipe, update_recipe, delete_recipe, manage_organizers]
    tier: 2
    capstone: true
    spec:
      user_story: |
        - As a user I can organise my recipes with tags and categories, view them in full, and keep my collection current
      contract: |
        golden path:
          1. create tag "Vegetarian" (POST /tags)
          2. create recipe "Pasta Primavera" (POST /recipes -> slug)
          3. update recipe: add tag + 3 ingredients + 2 steps (PUT /recipes/{slug})
          4. filter by tag "Vegetarian" -> 1 recipe shown
          5. view recipe detail -> ingredients + steps rendered
          6. delete recipe -> grid empty
          7. reload -> recipe gone; tag "Vegetarian" persists in GET /tags
    verification: |
      - full lifecycle across all 7 operations
      - state correct after reload
    docs: |
      - The capstone — every node exists in service of this workflow

verification:
  - node: mealie_app_shell
    tool: integrate_system.spl
    checks:
      - CORS headers present on all backend responses
      - frontend loads without console errors
      - all system applications pass acceptance tests against live system
    docs: |
      - README.md (product-level) — see the `readme` node above
