# ── Unified Duality Graph Schema v2.1 — Integrated Profile (Graph of Graphs) ─
# Migrated from graph-driven-workflow/apps/SPL/kanban/system.yaml
#
# The original system.yaml hand-merged backend/graph.yaml and frontend/graph.yaml
# under a bespoke `components:` registry. Here the two component graphs stay
# fully independent files and are composed declaratively via `imports:` —
# resolve_imports() pulls each component's `function.exports` in, namespaced
# as `<alias>.<export_name>`, with no copy/merge of either file's content.
domain: software/apps/kanban
target_languages: [python, typescript]
comment: |
  Kanban board: Vue.js frontend + FastAPI backend + SQLite storage. Users
  manage cards across three fixed columns (Backlog, In Progress, Done) —
  the first app in this family with a status enum and a move operation
  (changing an entity's column membership) rather than a simple boolean toggle.
capstone: manage_board

# Source of truth for id/version/domain_type — see
# docs/DEV/BUILD/refactoring-plan-v1.md §1.1.
blueprint:
  id: kanban_app
  schema_version: "2.2"
  graph_schema_version: "2.1"
  domain_type: integrated
  provenance: authored
  parent_blueprint: null
  lineage: []

imports:
  - id: backend
    graph: ./backend.graph.yaml
    comment: |
      FastAPI REST API at :8002, OpenAPI schema at /docs, CORS enabled for :5175.
      Mandatory — the frontend cannot function without it.
  - id: frontend
    graph: ./frontend.graph.yaml
    comment: |
      Vue.js SPA served by Vite at :5175. Already imports backend.graph.yaml
      itself to verify api_client's call contracts; this top-level graph only
      needs both components present to assemble the system-level applications.

# ── Port configuration (system-level, orchestration metadata) ────────────────
# Declared once here as the system's single source of truth; each component's
# own graph.yaml also carries a `port:` field for standalone use — spl/tools.py's
# check_port_consistency() (wired into integrate_system.spl) warns if a
# component's own declared port ever drifts from what's declared here.
ports:
  backend: ${{ settings.BACKEND_FASTAPI_PORT }}
  frontend: ${{ settings.FRONTEND_VITE_PORT }}

form:
  nodes:
    kanban_app_shell:
      kind: component
      defines: "System integration shell: frontend at :5175 consuming backend REST API at :8002 via CORS"
      tier: 1
      depends_on: [backend, frontend]
      comment: |
        frontend depends on backend's OpenAPI contract; api_client (in frontend)
        is verified against backend's five exported endpoints before this shell
        is considered complete — see frontend.graph.yaml's function.calls.

    readme:
      kind: doc
      defines: "README.md: product-level overview, setup, and run instructions for the whole kanban app"
      composed_of: [kanban_app_shell]
      tier: 2
      spec:
        interface: |
          Output: README.md at the system root (the same directory as this graph.yaml,
          or --output_dir when integrate_system.spl was run with one) — plain Markdown,
          not code.
        contract: |
          Must include, as Markdown sections:
          - Title + one-paragraph description of the whole app (Vue frontend + FastAPI
            backend + SQLite, three-column board, the applications it supports)
          - Architecture: frontend (:5175) calls backend (:8002) over REST, CORS enabled —
            one sentence, link to each component's own README.md for its own setup/run/test
            instructions rather than repeating them
          - Running the full system: build it (`spl3 run spl/build_app.spl ...`), then start
            backend and frontend together
          - Applications: one line per application from this graph's `applications:` block
            (create_card, view_board, move_card, delete_card, manage_board) — the
            user-facing capabilities, not implementation detail
        content_outline: |
          # <App name>
          One paragraph description.
          ## Architecture
          ## Running the full system
          ## Applications
      verification:
        node: |
          - README.md exists at the system root
          - contains headings for architecture, running the full system, and applications
      docs: |
        - Generated last, by integrate_system.spl, after both components are built and
          acceptance tests have run — so it can report real pass/fail results, not just
          intent
        - Not verified against code (kind: doc nodes skip compile/edge-symbol checks — see
          spl/tools.py verify_node/verify_edges); also not build_component.spl-generated
          like the per-component readmes, since this system graph.yaml is never passed to
          build_component.spl directly

function:
  exports:
    - name: manage_board
      kind: port
      from: kanban_app_shell.main
      signature: "() -> void"
      comment: |
        Single entry point. Serves the frontend, starts the backend, and wires
        CORS between them. The system capstone — every node in both component
        graphs exists in service of this workflow.

# ── System-level applications ────────────────────────────────────────────────
# Applications span components — they are the cross-component use-cases.
# Each needs at least one node from backend AND one from frontend.
applications:

  create_card:
    defines: |
      - User fills the card form and submits
      - new card appears in Backlog column
    needs:
      backend: [api_routes]
      frontend: [KanbanBoard]
    tier: 1
    spec:
      user_story: |
        - As a user I can create a card with a title and optional description
      contract: |
        - POST /cards → 201
        - card appears in Backlog
        - empty title rejected (422)
        - Valid KanbanStatus values are exactly "backlog", "in_progress", "done"
          (NOT "todo" — this app's default column is called "backlog", not "todo";
          "todo" is rejected by Pydantic with 422)
        - CardCreate.status defaults to "backlog" when omitted from the request body
    verification: |
      - e2e: submit form → POST fires → Backlog column gains new card
    docs: |
      - Entry point for the board workflow

  view_board:
    defines: |
      - User sees all three columns with their cards on page load
    needs:
      backend: [api_routes]
      frontend: [KanbanBoard]
    tier: 1
    spec:
      user_story: |
        - As a user I can see the full board state when I open the app
      contract: |
        - GET /board on mount
        - three columns rendered
        - each column shows its cards in order
        - GET /board returns a JSON object with exactly three top-level keys:
          "backlog", "in_progress", "done" — each a flat array of Card objects.
          There is NO "columns" wrapper array and no "name"/"status" key per
          column; the three status strings ARE the object's own keys.
        - Valid KanbanStatus values are exactly "backlog", "in_progress", "done"
          (NOT "todo")
    verification: |
      - e2e: seed cards in different columns → reload → all appear in correct columns
    docs: |
      - Validates the board_view grouping end-to-end

  move_card:
    defines: |
      - User selects a target column in the card dropdown
      - card moves to that column
    needs:
      backend: [api_routes]
      frontend: [KanbanBoard]
    tier: 1
    spec:
      user_story: |
        - As a user I can move a card between columns to reflect its progress
      contract: |
        - PUT /cards/{id}/move → 200
        - card disappears from source column
        - appears in target column
        - Valid KanbanStatus values are exactly "backlog", "in_progress", "done"
          (NOT "todo" — a card's default/starting status is "backlog")
        - GET /board's response has "backlog"/"in_progress"/"done" as its own
          top-level keys (flat arrays of Card), not a "columns" wrapper
    verification: |
      - e2e: move Backlog card to In Progress → board refreshes → card in correct column
    docs: |
      - Core Kanban interaction
      - exercises the sub-resource URL pattern

  delete_card:
    defines: |
      - User clicks Delete on a card
      - card is permanently removed
    needs:
      backend: [api_routes]
      frontend: [KanbanBoard]
    tier: 1
    spec:
      user_story: |
        - As a user I can delete a card I no longer need
      contract: |
        - DELETE /cards/{id} → 204
        - card removed from board
        - column shows empty if it was the last
        - Valid KanbanStatus values are exactly "backlog", "in_progress", "done"
          (NOT "todo"); CardCreate.status defaults to "backlog" when omitted
    verification: |
      - e2e: delete last card in a column → column shows empty state
    docs: |
      - Edge case: empty column must still render

  manage_board:
    defines: |
      - User can create, view, move, and delete cards — full board workflow
    needs:
      applications: [create_card, view_board, move_card, delete_card]
    tier: 2
    capstone: true
    spec:
      user_story: |
        - As a user I can manage my work across Backlog, In Progress, and Done columns
      contract: |
        - golden path: create 3 → move 1 to In Progress → move 1 to Done → delete Done card → 2 Backlog / 1 In Progress / 0 Done
        - persists on reload
    verification: |
      - full lifecycle across all four operations
      - board state correct after reload
    docs: |
      - The capstone — every node exists in service of this workflow

verification:
  - node: kanban_app_shell
    tool: integrate_system.spl
    checks:
      - CORS headers present on all backend responses
      - frontend loads without console errors
      - all four applications pass acceptance tests against live system
    docs: |
      - README.md (product-level) — see the `readme` node above
      - deployment guide
