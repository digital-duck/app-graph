# ── Unified Duality Graph Schema v2.1 — Software Profile ────────────────────
# Migrated from graph-driven-workflow/apps/SPL/todo/components/frontend/graph.yaml
domain: software/frontend/vue
target_languages: [typescript]
comment: |
  Vue.js frontend: API client, TodoItem component, TodoList component.
capstone: list_component

# tech_profile/port: see backend.graph.yaml's comment — orchestration
# metadata for spl/tools.py's system-level tools, not part of the core schema.
# Pulled from settings.yaml (docs/DEV/BUILD/refactoring-plan-v1.md §1.2).
tech_profile: vue_typescript
port: ${{ settings.FRONTEND_VITE_PORT }}

# ── Blueprint provenance (schema v2.2 addition, see docs/DEV/BUILD/blueprint-schema-v2.2.md) ──
# Source of truth for id/version/domain_type — see
# docs/DEV/BUILD/refactoring-plan-v1.md §1.1.
blueprint:
  id: todo_app_frontend
  schema_version: "2.2"
  graph_schema_version: "2.1"
  domain_type: software
  provenance: authored
  parent_blueprint: null
  lineage: []

imports:
  - id: backend
    graph: ./backend.graph.yaml
    comment: |
      The backend REST API is a mandatory dependency. api_client's four calls
      are verified against backend's four exported endpoint contracts below —
      a mismatch (e.g. wrong HTTP verb, wrong signature) fails check_call_contracts
      at graph-load time instead of at integration time.

form:
  primitives:
    vuejs:
      defines: "Vue.js 3: reactive component framework with Composition API"
      tier: 0
      kind: config
    typescript:
      defines: "TypeScript: typed superset of JavaScript"
      tier: 0
      kind: config
    vite:
      defines: "Vite: frontend build tool and dev server"
      tier: 0
      kind: config
    fetch_api:
      defines: "Browser fetch API: promise-based HTTP client"
      tier: 0
      kind: config

  nodes:
    api_client:
      kind: module
      defines: "TypeScript fetch wrappers matching the backend OpenAPI contract"
      composed_of: [fetch_api, typescript]
      tier: 1
      ports:
        list_todos:
          signature: "GET /todos -> Todo[]"
          kind: call
          direction: out
        create_todo:
          signature: "POST /todos (title: string) -> Todo"
          kind: call
          direction: out
        toggle_todo:
          signature: "PUT /todos/{id} (completed: boolean) -> Todo"
          kind: call
          direction: out
        delete_todo:
          signature: "DELETE /todos/{id} -> void"
          kind: call
          direction: out
      spec:
        interface: |
          getTodos(): Promise<Todo[]>             — GET    /todos
          createTodo(title: string): Promise<Todo> — POST   /todos
          toggleTodo(id: number, completed: boolean): Promise<Todo>
                                                    — PUT    /todos/{id}  (NOT PATCH — the
                                                      backend only registers PUT; PATCH gets
                                                      405 Method Not Allowed)
          deleteTodo(id: number): Promise<void>    — DELETE /todos/{id}
        contract: |
          - HTTP methods are EXACTLY as listed above — do not substitute PATCH for PUT or
            any other verb for the ones given, even if it seems like a more idiomatic REST
            choice; the backend's routes (see backend.graph.yaml's api_routes) only respond
            to the exact method shown
          - base URL from VITE_API_BASE_URL env var
          - throws on non-2xx
          - returns typed response
      verification:
        node: |
          - TypeScript compiles with strict mode
        edge: |
          - function signatures match backend OpenAPI spec (validated against /docs schema)
      docs: |
        - Single integration point between Vue frontend and FastAPI backend

    item_component:
      kind: component
      defines: "Vue component rendering one todo: title, completed checkbox, delete button"
      composed_of: [vuejs, typescript]
      tier: 1
      spec:
        interface: |
          - props: { todo: Todo }
          - emits: toggle(id: number), delete(id: number)
        contract: |
          - renders title
          - checkbox reflects completed
          - buttons emit correct events
      verification:
        node: |
          - vitest: renders with valid props
          - emits toggle on checkbox click
          - emits delete on button
        edge: |
          - emitted event payloads (id types) match what list_component forwards to api_client
      docs: |
        - Purely presentational — owns no state, issues no fetch calls

    list_component:
      kind: component
      defines: "Vue component: new-todo input form + scrollable list of TodoItem components"
      composed_of: [vuejs, typescript, item_component, api_client]
      tier: 2
      spec:
        interface: |
          - no props
          - fetches todos on mount
          - manages local todos: Ref<Todo[]>
        contract: |
          - shows empty state when list empty
          - submit calls createTodo
          - forwards toggle/delete to api_client
      verification:
        node: |
          - vitest: renders empty state
          - renders seeded list
          - submit adds item
          - toggle/delete propagate
        edge: |
          - api_client calls fire on correct user actions
          - UI re-renders after each mutation
      docs: |
        - The only stateful component — owns the todo list and all side effects

    App_vue:
      kind: component
      defines: "Root Vue SFC that mounts TodoList as the sole child component"
      composed_of: [vuejs, typescript, list_component]
      tier: 3
      spec:
        interface: |
          - no props, no emits, no state
        contract: |
          - template contains only <TodoList />
          - imports TodoList from ./components/TodoList.vue
      verification:
        node: |
          - valid .vue SFC with <template> and <script setup lang='ts'>
          - renders exactly one component
        edge: |
          - imports TodoList from ./components/TodoList.vue and uses it in template
      docs: |
        - Thin shell — exists only to provide a named root component for createApp()

    main_ts:
      kind: module
      defines: "Vite entry point — creates the Vue app instance and mounts it to #app"
      composed_of: [vuejs, typescript, App_vue]
      tier: 4
      spec:
        interface: |
          - no exports
          - side-effect only
        contract: |
          - calls createApp(App).mount('#app')
          - App imported from ./App.vue
          - '#app' matches index.html
      verification:
        node: |
          - file contains createApp and .mount()
          - imports App from ./App.vue
        edge: |
          - import path matches App_vue location (./App.vue)
          - mount target '#app' matches index.html div id
      docs: |
        - Entry point only — no logic, no state, no other imports

    readme:
      kind: doc
      defines: "README.md: setup, run, and test instructions for this frontend"
      composed_of: [main_ts]
      tier: 5
      spec:
        interface: |
          Output: README.md at the component root (NOT under src/) — plain Markdown, not code.
          Do NOT follow the Vue/TypeScript code-style conventions above for this file; those apply
          to source files only. This file is prose documentation.
        contract: |
          Must include, as Markdown sections:
          - Title + one-paragraph description of what this frontend does
          - Prerequisites: Node.js version, how to install dependencies (npm install)
          - Running the dev server: exact command (npm run dev) and the default URL/port
            (http://localhost:5173), and that it expects the backend at http://localhost:8000
          - Running tests: exact command (npm test)
          - Component summary: list each component (TodoItem, TodoList, App) with a one-line
            description of its role
        content_outline: |
          # <Component name>
          One paragraph description.
          ## Prerequisites
          ## Running the dev server
          ## Running tests
          ## Components
      verification:
        node: |
          - README.md exists at component root
          - contains headings for prerequisites, running the dev server, running tests, and components
      docs: |
        - Generated last, after all code nodes, so it can describe the actual generated component set
        - Not verified against the code (kind: doc nodes skip compile/edge-symbol checks — see
          spl/tools.py verify_node/verify_edges)

function:
  calls:
    - id: api_client_calls_backend_list
      from: api_client.list_todos
      to: backend.list_todos
      contract:
        consumer_requires: "GET /todos -> Todo[]"
        provider_guarantees: "GET /todos -> Todo[]"
    - id: api_client_calls_backend_create
      from: api_client.create_todo
      to: backend.create_todo
      contract:
        consumer_requires: "POST /todos (title: string) -> Todo"
        provider_guarantees: "POST /todos (title: string) -> Todo"
    - id: api_client_calls_backend_toggle
      from: api_client.toggle_todo
      to: backend.toggle_todo
      contract:
        consumer_requires: "PUT /todos/{id} (completed: boolean) -> Todo"
        provider_guarantees: "PUT /todos/{id} (completed: boolean) -> Todo"
    - id: api_client_calls_backend_delete
      from: api_client.delete_todo
      to: backend.delete_todo
      contract:
        consumer_requires: "DELETE /todos/{id} -> void"
        provider_guarantees: "DELETE /todos/{id} -> void"

  exports:
    - name: list_component
      kind: port
      from: list_component.render
      signature: "() -> void"
      comment: |
        The frontend capstone. Composed at the system level (see ./main.graph.yaml)
        with backend's exports to form the end-to-end CRUD applications.

verification:
  - node: api_client
    backend: vitest
    tests: tests/api.spec.ts
  - node: item_component
    backend: vitest
    tests: tests/TodoItem.spec.ts
  - node: list_component
    backend: vitest
    tests: tests/TodoList.spec.ts
