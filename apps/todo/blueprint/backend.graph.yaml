# ── Unified Duality Graph Schema v2.1 — Software Profile ────────────────────
# Migrated from graph-driven-workflow/apps/SPL/todo/components/backend/graph.yaml
domain: software/backend/fastapi
target_languages: [python]
comment: |
  FastAPI backend: schema, DB connection, ORM model, CRUD operations, API routes.
capstone: api_routes

# tech_profile/port: orchestration metadata read directly by spl/tools.py's
# system-level tools (component_tech_profile/component_port) — not part of
# the core graph_code schema (GraphDomain has no field for either), since
# build_order/validate_full/check_call_contracts don't need to know how or
# where a component runs, only build_app.spl/integrate_system.spl do.
# Pulled from settings.yaml (docs/DEV/BUILD/refactoring-plan-v1.md §1.2), same
# key the system-level main.graph.yaml's ports: block uses.
tech_profile: python_fastapi
port: ${{ settings.BACKEND_FASTAPI_PORT }}

# ── Blueprint provenance (schema v2.2 addition, see docs/DEV/BUILD/blueprint-schema-v2.2.md) ──
# Source of truth for id/version/domain_type — see
# docs/DEV/BUILD/refactoring-plan-v1.md §1.1.
blueprint:
  id: todo_app_backend
  schema_version: "2.2"
  graph_schema_version: "2.1"
  domain_type: software
  provenance: authored
  parent_blueprint: null
  lineage: []

form:
  primitives:
    python:
      defines: "Python 3.x runtime and standard library"
      tier: 0
      kind: config
    sqlite:
      defines: "SQLite embedded relational database engine"
      tier: 0
      kind: config
    fastapi:
      defines: "FastAPI web framework: routing, dependency injection, OpenAPI generation"
      tier: 0
      kind: config
    sqlalchemy:
      defines: "SQLAlchemy ORM: declarative models, session management, query DSL"
      tier: 0
      kind: config
    pydantic:
      defines: "Pydantic: runtime data validation and serialization via type hints"
      tier: 0
      kind: config

  nodes:
    requirements:
      kind: doc
      defines: "requirements.txt: pinned pip dependencies for this backend"
      composed_of: [python, sqlite, fastapi, sqlalchemy, pydantic]
      tier: 1
      spec:
        interface: |
          Output: requirements.txt at the component root (NOT under app/) — plain pip
          requirements format, one package per line, not Python code.
        contract: |
          List the pip packages needed to install and run this backend, with minimum-version
          pins (>=). Include:
          - fastapi, sqlalchemy, pydantic (from the primitives above — these are pip package
            names, do not list "python" or "sqlite" themselves, they are not pip packages)
          - uvicorn[standard] — needed to actually run the server (uvicorn app.main:app),
            even though it is not one of the primitives above and is never imported directly
          - pytest, httpx — needed to run this component's test suite (httpx is required by
            FastAPI's TestClient)
          One package per line, e.g. `fastapi>=0.111.0`. No comments, no section headers,
          no pip install command — just the requirements.txt file content itself.
      verification:
        node: |
          - requirements.txt exists at component root
          - contains fastapi, sqlalchemy, pydantic, uvicorn, pytest, httpx (one per line)
      docs: |
        - Generated early (depends only on primitives, not on generated code) since it's a
          static manifest of the tech stack, not something that needs the implementation
          to exist first
        - Not verified against the code (kind: doc nodes skip compile/edge-symbol checks — see
          spl/tools.py verify_node/verify_edges)

    data_schema:
      kind: concept
      defines: "Pydantic models: TodoCreate (input), Todo (output with id + completed), ToggleRequest (toggle body)"
      composed_of: [pydantic, python]
      tier: 1
      spec:
        interface: |
          Imports: from pydantic import BaseModel, ConfigDict, field_validator
          TodoCreate(title: str)
          Todo(id: int, title: str, completed: bool = False)
            — model_config = ConfigDict(from_attributes=True)  [class attribute, NOT an import]
          ToggleRequest(completed: bool)
        contract: |
          title field_validator MUST strip whitespace first, then raise ValueError if result is empty,
          and return the stripped string — `return v.strip()` NOT `return v`; omitting the strip
          breaks test_todo_create_strips_whitespace.
          id auto-assigned; completed defaults to false.
          All three models defined in this file; ConfigDict imported, model_config is a class attribute.
      verification:
        node: |
          - pydantic rejects missing title
          - all three classes importable from app.schemas
        edge: |
          - Todo schema field types match SQLAlchemy column types exactly
      docs: |
        - Central data contract shared by ORM layer and API routes
        - ToggleRequest is the PUT request body

    db_connection:
      kind: module
      defines: "SQLAlchemy engine and session factory bound to todos.db"
      composed_of: [sqlalchemy, sqlite, python]
      tier: 1
      spec:
        interface: |
          DATABASE_URL = "sqlite:///./todos.db"   # literal — do not use "app.db" or any other name
          - get_db() -> Generator[Session, None, None]
        contract: |
          - the DB filename is EXACTLY "todos.db", relative to the working directory the
            server is started from — never "app.db" or any other generic/default name
          - yields one session per request
          - always closes on exit
          - creates DB file if absent
      verification:
        node: |
          - engine.connect() succeeds
          - session opens and closes without error
        edge: |
          - SQLite file created at expected path
      docs: |
        - FastAPI dependency — injected into every route that touches the database

    orm_model:
      kind: module
      defines: "SQLAlchemy declarative model mapping Todo to the todos table"
      composed_of: [sqlalchemy, data_schema, db_connection]
      tier: 2
      spec:
        interface: |
          Imports: EXACTLY these three lines, in this order, nothing added,
          nothing else touching app.schemas in any form:
              from __future__ import annotations
              from sqlalchemy.orm import Mapped, mapped_column
              from app.database import Base
          No `from app.schemas import ...`, no `from app import schemas`, no
          `import app.schemas`, no `# noqa` marker of any kind — this file has
          no runtime dependency on app.schemas at all, only a conceptual one
          (matching column types by hand, described below).

          class TodoModel(Base):
              __tablename__ = "todos"
              id: Mapped[int]         # PK, autoincrement
              title: Mapped[str]
              completed: Mapped[bool] # default false

          These are the ONLY THREE columns/attributes on this class. No other
          fields, no ForeignKey, no relationship(), no back_populates — this
          is a single-table model with zero relationships.
        contract: |
          - column types and nullability match the Pydantic Todo class in
            app/schemas.py exactly (id: int, title: str, completed: bool) —
            there is no class named "TodoSchema" anywhere in this app; the
            Pydantic class is named Todo. Do not import it either way — this
            is a description of what to match by hand, not an import target.
          - table created via create_all()
          - data_schema (this node's dependency, app/schemas.py) is a Pydantic
            module, NOT a database table — it defines request/response models
            only, and TodoModel must not reference it, or any other node name,
            via ForeignKey/relationship() or via any import. TodoModel has no
            foreign keys and no relationships to any other table, full stop —
            this component has only one table.
      verification:
        node: |
          - create_all() creates table
          - insert + select roundtrip preserves all fields
        edge: |
          - TodoModel fields map 1:1 to Todo Pydantic schema (no silent coercion)
      docs: |
        - Single source of truth for DB schema

    crud_operations:
      kind: module
      defines: "Python functions: get_todos, create_todo, toggle_todo, delete_todo"
      composed_of: [orm_model, db_connection, data_schema]
      tier: 3
      spec:
        interface: |
          Imports: from app.schemas import TodoCreate, Todo — EXACTLY these two class
          names. There is no class named TodoRead, TodoOut, TodoResponse, or TodoDTO
          anywhere in this app; do not invent one. The response/output model is named
          Todo, the same class data_schema defines — do NOT rename it on import or alias
          it to something else.

          get_todos(db: Session) -> list[Todo]
          create_todo(db: Session, item: TodoCreate) -> Todo
          toggle_todo(db: Session, id: int, completed: bool) -> Todo
          delete_todo(db: Session, id: int) -> None
        contract: |
          - toggle/delete raise HTTP 404 if id not found
          - return Pydantic Todo (imported as-is from app.schemas, not renamed/aliased),
            not the ORM model
      verification:
        node: |
          - pytest with in-memory SQLite
          - each function tested in isolation
        edge: |
          - returned Pydantic models pass Todo schema validation
          - 404 raised on unknown id
      docs: |
        - Pure data layer — no FastAPI imports
        - testable without starting a server

    api_routes:
      kind: module
      defines: "FastAPI router exposing CRUD as REST endpoints at /todos"
      composed_of: [fastapi, crud_operations, data_schema]
      tier: 4
      ports:
        list_todos:
          signature: "GET /todos -> Todo[]"
          kind: call
          direction: out
        create_todo:
          signature: "POST /todos (title: string) -> Todo"
          kind: call
          direction: out
        toggle_todo:
          signature: "PUT /todos/{id} (completed: boolean) -> Todo"
          kind: call
          direction: out
        delete_todo:
          signature: "DELETE /todos/{id} -> void"
          kind: call
          direction: out
      spec:
        interface: |
          Imports: from app.schemas import TodoCreate, Todo, ToggleRequest — EXACTLY
          these three class names. There is no TodoRead/TodoOut/TodoResponse/TodoDTO
          anywhere in this app; every route's response_model is Todo, imported as-is.

          GET    /todos        -> list[Todo]
          POST   /todos        -> Todo  (201)
          PUT    /todos/{id}   -> Todo
          DELETE /todos/{id}   -> None  (204)
        contract: |
          CORS allowed origin built from FRONTEND_VITE_PORT, imported from app.config
          (from app.config import FRONTEND_VITE_PORT) — do NOT hardcode the port number or
          the origin URL as a string literal; construct allow_origins from the imported
          constant instead (e.g. [f"http://localhost:{FRONTEND_VITE_PORT}"]). This is what
          lets changing FRONTEND_VITE_PORT in settings.yaml propagate here without
          regenerating this file — see docs/DEV/BUILD/refactoring-plan-v1.md §1.2.
          Pydantic validates requests; 404 on unknown id; OpenAPI at /docs.
          MUST import the models module (from app import models) so SQLAlchemy registers TodoModel with
          Base BEFORE calling create_all.
          MUST call Base.metadata.create_all(bind=engine) at module level (after imports, before
          app = FastAPI()) — omitting this causes OperationalError: no such table: todos.
          MUST import get_db from app.database — NEVER redefine get_db locally; tests override
          app.dependency_overrides[get_db] targeting the function object from app.database; a local
          redefinition creates a different object so overrides are invisible and DB isolation breaks.
      verification:
        node: |
          - pytest TestClient: each endpoint returns correct status + response shape
          - GET /todos returns [] on fresh DB (not 500)
        edge: |
          - CORS headers present
          - OpenAPI schema matches frontend api_client signatures
      docs: |
        - The backend's public surface — frontend api_client is validated against this contract

    readme:
      kind: doc
      defines: "README.md: setup, run, and test instructions for this backend"
      composed_of: [api_routes]
      tier: 5
      spec:
        interface: |
          Output: README.md at the component root (NOT under app/) — plain Markdown, not code.
          Do NOT follow the Python/FastAPI code-style conventions above for this file; those apply
          to source files only. This file is prose documentation.
        contract: |
          Must include, as Markdown sections:
          - Title + one-paragraph description of what this backend does
          - Prerequisites: Python version, how to install dependencies (pip install -r requirements.txt
            or equivalent — infer from the primitives above: fastapi, sqlalchemy, pydantic, sqlite)
          - Running the server: exact command to start it (uvicorn app.main:app --reload) and the
            default URL/port (http://localhost:8000, OpenAPI docs at /docs)
          - Running tests: exact command (pytest tests/)
          - API summary: list each endpoint from api_routes' ports below with method, path, and
            one-line purpose
        content_outline: |
          # <Component name>
          One paragraph description.
          ## Prerequisites
          ## Running the server
          ## Running tests
          ## API endpoints
      verification:
        node: |
          - README.md exists at component root
          - contains headings for prerequisites, running the server, running tests, and API endpoints
      docs: |
        - Generated last, after all code nodes, so it can describe the actual generated API surface
        - Not verified against the code (kind: doc nodes skip compile/edge-symbol checks — see
          spl/tools.py verify_node/verify_edges)

function:
  exports:
    - name: list_todos
      kind: port
      from: api_routes.list_todos
      signature: "GET /todos -> Todo[]"
    - name: create_todo
      kind: port
      from: api_routes.create_todo
      signature: "POST /todos (title: string) -> Todo"
    - name: toggle_todo
      kind: port
      from: api_routes.toggle_todo
      signature: "PUT /todos/{id} (completed: boolean) -> Todo"
    - name: delete_todo
      kind: port
      from: api_routes.delete_todo
      signature: "DELETE /todos/{id} -> void"
      comment: |
        The four exports above are the OpenAPI contract that frontend.graph.yaml
        imports and binds api_client calls against — see frontend.graph.yaml's
        function.calls for the consumer side of each contract.

verification:
  - node: data_schema
    backend: pytest
    tests: tests/test_schemas.py
  - node: crud_operations
    backend: pytest
    tests: tests/test_crud.py
  - node: api_routes
    backend: pytest
    tests: tests/test_routes.py
    comment: |
      - 404 on unknown id
      - GET /todos returns [] on fresh DB, not 500
