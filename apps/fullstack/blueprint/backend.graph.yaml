# ── Unified Duality Graph Schema v2.1 — Software Profile ────────────────────
# Migrated from graph-driven-workflow/apps/SPL/fullstack/components/backend/graph.yaml
#
# This is the first ported app with JWT auth + RBAC. It does NOT import
# apps/jwt_provider/blueprint/jwt_provider.graph.yaml or
# apps/physics_app/blueprint/auth_middleware.graph.yaml as a component
# dependency — the source app's own security_module bundles JWT issuing,
# bcrypt password hashing, and stateless password-reset tokens into one
# self-contained node (a different shape than jwt_provider's standalone
# issuing/verification library), and restructuring that design during
# migration would risk diverging from the source's own tested contract.
# Kept as a candidate for a later refactor once both shapes have been built
# and compared for real, per apps/README.md's note.
domain: software/backend/fastapi
target_languages: [python]
comment: |
  FastAPI backend: JWT auth (bcrypt password hashing, HS256 access + password-reset
  tokens), RBAC (superuser flag), user management, owner-scoped items CRUD.
capstone: api_routes

# tech_profile/port: orchestration metadata read directly by spl/tools.py's
# system-level tools (component_tech_profile/component_port) — not part of
# the core graph_code schema, since build_order/validate_full/check_call_contracts
# don't need to know how or where a component runs, only build_app.spl/
# integrate_system.spl do.
tech_profile: python_fastapi
port: ${{ settings.BACKEND_FASTAPI_PORT }}

# Source of truth for id/version/domain_type — see
# docs/DEV/BUILD/refactoring-plan-v1.md §1.1.
blueprint:
  id: fullstack_app_backend
  schema_version: "2.2"
  graph_schema_version: "2.1"
  domain_type: software
  provenance: authored
  parent_blueprint: null
  lineage: []

form:
  primitives:
    python:
      defines: "Python 3.11+ runtime and standard library"
      tier: 0
      kind: config
    sqlite:
      defines: "SQLite embedded relational database engine"
      tier: 0
      kind: config
    fastapi:
      defines: "FastAPI web framework: routing, dependency injection, OpenAPI generation"
      tier: 0
      kind: config
    sqlalchemy:
      defines: "SQLAlchemy ORM: declarative models, session management, query DSL"
      tier: 0
      kind: config
    pydantic:
      defines: "Pydantic v2: runtime validation and serialization via type hints"
      tier: 0
      kind: config
    pyjwt:
      defines: "PyJWT: JSON Web Token encode/decode (HS256)"
      tier: 0
      kind: config
    bcrypt_lib:
      defines: "bcrypt: password hashing and verification (import bcrypt directly — NOT passlib, which is incompatible with bcrypt>=4)"
      tier: 0
      kind: config

  nodes:
    requirements:
      kind: doc
      defines: "requirements.txt: pinned pip dependencies for this backend"
      composed_of: [python, sqlite, fastapi, sqlalchemy, pydantic, pyjwt, bcrypt_lib]
      tier: 1
      spec:
        interface: |
          Output: requirements.txt at the component root (NOT under app/) — plain pip
          requirements format, one package per line, not Python code.
        contract: |
          List the pip packages needed to install and run this backend, with minimum-version
          pins (>=). Include:
          - fastapi, sqlalchemy, pydantic, PyJWT, bcrypt (from the primitives above — pip
            package names; do not list "python" or "sqlite" themselves, not pip packages)
          - pydantic[email] — EmailStr validation, required by data_schema
          - uvicorn[standard] — needed to run the server (uvicorn app.main:app), even though
            it is not one of the primitives above and is never imported directly
          - pytest, httpx — needed to run this component's test suite (httpx is required by
            FastAPI's TestClient)
          One package per line, e.g. `fastapi>=0.111.0`. No comments, no section headers,
          no pip install command — just the requirements.txt file content itself.
      verification:
        node: |
          - requirements.txt exists at component root
          - contains fastapi, sqlalchemy, pydantic, PyJWT, bcrypt, uvicorn, pytest, httpx
      docs: |
        - Generated early (depends only on primitives, not on generated code)
        - Not verified against the code (kind: doc nodes skip compile/edge-symbol checks — see
          spl/tools.py verify_node/verify_edges)

    data_schema:
      kind: concept
      defines: "All Pydantic v2 schemas for users, items, tokens, and messages"
      composed_of: [pydantic]
      tier: 1
      spec:
        interface: |
          # app/schemas.py
          from pydantic import BaseModel, EmailStr, ConfigDict, field_validator

          class UserBase(BaseModel):
              email: EmailStr
              is_active: bool = True
              is_superuser: bool = False
              full_name: str | None = None

          class UserCreate(UserBase):
              password: str                           # min 8, max 128 chars

          class UserRegister(BaseModel):              # self-registration (no role fields)
              email: EmailStr
              password: str
              full_name: str | None = None

          class UserUpdate(BaseModel):                # all fields optional (PATCH)
              email: EmailStr | None = None
              is_active: bool | None = None
              is_superuser: bool | None = None
              full_name: str | None = None
              password: str | None = None

          class UserUpdateMe(BaseModel):              # user's own profile (no role fields)
              full_name: str | None = None
              email: EmailStr | None = None

          class UpdatePassword(BaseModel):
              current_password: str
              new_password: str

          class UserPublic(UserBase):
              model_config = ConfigDict(from_attributes=True)
              id: str
              created_at: datetime | None = None

          class UsersPublic(BaseModel):
              data: list[UserPublic]
              count: int

          class ItemBase(BaseModel):
              title: str                              # min 1, max 255
              description: str | None = None

          class ItemCreate(ItemBase):
              pass

          class ItemUpdate(BaseModel):                # all optional for partial PUT
              title: str | None = None
              description: str | None = None

          class ItemPublic(ItemBase):
              model_config = ConfigDict(from_attributes=True)
              id: str
              owner_id: str
              created_at: datetime | None = None

          class ItemsPublic(BaseModel):
              data: list[ItemPublic]
              count: int

          class Token(BaseModel):
              access_token: str
              token_type: str = "bearer"

          class TokenPayload(BaseModel):
              sub: str | None = None                 # user UUID as string

          class NewPassword(BaseModel):
              token: str
              new_password: str                      # min 8 chars

          class Message(BaseModel):
              message: str
        contract: |
          All response schemas (UserPublic, ItemPublic) have from_attributes=True for ORM
          serialisation.
          hashed_password is NOT present on any response schema — only on the ORM User model.
          UserPublic.id is str (UUID stored as String in DB).
          ItemPublic.owner_id is str.
          EmailStr requires pydantic[email] / email-validator installed.
          UserCreate and UserRegister both require password; UserCreate also allows is_superuser.
          UserUpdate: all fields optional; used by superuser PATCH /{user_id}.
          UserUpdateMe: subset — no is_active, is_superuser (prevents privilege escalation).
      verification:
        node: |
          - import all schemas
          - validate UserPublic.model_validate({'id':'uuid','email':'a@b.com','is_active':True,'is_superuser':False})
          - verify hashed_password not in UserPublic.model_fields
        edge: |
          - TokenPayload.sub is str not UUID
          - ItemPublic.owner_id is str
      docs: |
        - Central data contract; hashed_password never leaves the ORM layer

    db_connection:
      kind: module
      defines: "SQLite engine, DeclarativeBase, session factory, get_db dependency"
      composed_of: [sqlite, sqlalchemy]
      tier: 1
      spec:
        interface: |
          # app/database.py
          DATABASE_URL = "sqlite:///./fullstack.db"
          engine = create_engine(DATABASE_URL, connect_args={"check_same_thread": False})

          class Base(DeclarativeBase): pass

          def get_db() -> Generator[Session, None, None]:
              with Session(engine) as session:
                  yield session

          SessionDep = Annotated[Session, Depends(get_db)]
        contract: |
          `check_same_thread=False` required for SQLite with FastAPI.
          `Base` from `DeclarativeBase` (SQLAlchemy 2.0 style, not legacy `declarative_base()`).
          `get_db` uses context manager `with Session(engine) as session` — not try/finally.
          `SessionDep` type alias exported so route functions can use it as a type annotation.
      verification:
        node: |
          - from app.database import Base, engine, get_db, SessionDep
          - engine.url contains 'sqlite'
        edge: |
          - Base imported by orm_model for model declarations
      docs: |
        - FastAPI dependency — injected into every route that touches the database

    security_module:
      kind: module
      defines: "JWT token creation/verification and bcrypt password hashing"
      composed_of: [pyjwt, bcrypt_lib, python]
      tier: 1
      spec:
        interface: |
          # app/security.py
          from datetime import UTC, datetime, timedelta
          import bcrypt
          import jwt

          ALGORITHM = "HS256"
          SECRET_KEY = "dev-secret-key-change-in-production"
          ACCESS_TOKEN_EXPIRE_MINUTES = 60 * 24 * 8    # 8 days
          EMAIL_RESET_TOKEN_EXPIRE_HOURS = 48

          def create_access_token(subject: str, expires_delta: timedelta | None = None) -> str:
              ...
          def verify_password(plain_password: str, hashed_password: str) -> bool:
              ...
          def get_password_hash(password: str) -> str:
              ...
          def generate_password_reset_token(email: str) -> str:
              ...
          def verify_password_reset_token(token: str) -> str | None:
              ...
        contract: |
          CRITICAL: Use `import bcrypt` directly. Do NOT use passlib (incompatible with bcrypt>=4).
          get_password_hash: return bcrypt.hashpw(password.encode(), bcrypt.gensalt()).decode()
          verify_password: return bcrypt.checkpw(plain_password.encode(), hashed_password.encode())
          create_access_token: encodes {"sub": str(subject), "exp": now + expires_delta} with
            SECRET_KEY + HS256. If expires_delta is None, default to ACCESS_TOKEN_EXPIRE_MINUTES.
          generate_password_reset_token: encodes {"sub": email, "exp": now + 48h, "nbf": now}.
          verify_password_reset_token: decodes token; returns email str on success; None on
            InvalidTokenError.
          SECRET_KEY constant exported for use in auth_deps (JWT decode).
          ALGORITHM constant exported for use in auth_deps.
      verification:
        node: |
          - token=create_access_token('uuid-str')
          - payload=jwt.decode(token,SECRET_KEY,[ALGORITHM])
          - assert payload['sub']=='uuid-str'
          - verify_password checks correct
          - get_password_hash returns non-empty str
          - verify_password_reset_token round-trips generate_password_reset_token
        edge: |
          - auth_deps imports SECRET_KEY + ALGORITHM from security_module
          - api_routes imports generate/verify_password_reset_token
      docs: |
        - First auth module in this app family: JWT + bcrypt bundled together
        - replaces pwdlib/passlib with direct bcrypt (passlib incompatible with bcrypt>=4)

    orm_model:
      kind: module
      defines: "SQLAlchemy ORM table models for User and Item"
      composed_of: [db_connection, sqlalchemy, python]
      tier: 2
      spec:
        interface: |
          # app/models.py
          from datetime import datetime
          from uuid import uuid4
          from sqlalchemy import String, Boolean, ForeignKey, Text, func
          from sqlalchemy.orm import Mapped, mapped_column, relationship
          from app.database import Base

          class User(Base):
              __tablename__ = "user"
              id: Mapped[str] = mapped_column(String(36), primary_key=True, default=lambda: str(uuid4()))
              email: Mapped[str] = mapped_column(String(255), unique=True, index=True, nullable=False)
              hashed_password: Mapped[str] = mapped_column(String, nullable=False)
              is_active: Mapped[bool] = mapped_column(Boolean, default=True)
              is_superuser: Mapped[bool] = mapped_column(Boolean, default=False)
              full_name: Mapped[str | None] = mapped_column(String(255), nullable=True)
              created_at: Mapped[datetime | None] = mapped_column(server_default=func.now())
              items: Mapped[list["Item"]] = relationship(back_populates="owner", cascade="all, delete-orphan")

          class Item(Base):
              __tablename__ = "item"
              id: Mapped[str] = mapped_column(String(36), primary_key=True, default=lambda: str(uuid4()))
              title: Mapped[str] = mapped_column(String(255), nullable=False)
              description: Mapped[str | None] = mapped_column(String(255), nullable=True)
              owner_id: Mapped[str] = mapped_column(String(36), ForeignKey("user.id", ondelete="CASCADE"), nullable=False)
              created_at: Mapped[datetime | None] = mapped_column(server_default=func.now())
              owner: Mapped["User | None"] = relationship(back_populates="items")
        contract: |
          Table name `user` (not `users`) to match reference.
          UUID stored as String(36) with lambda default — NOT server default UUID.
          `hashed_password` on User ORM but NOT on any Pydantic schema (invariant).
          ForeignKey("user.id", ondelete="CASCADE") — DB-level cascade.
          Relationship cascade="all, delete-orphan" — ORM-level cascade.
          `created_at` uses server_default=func.now() — DB fills it; not set by app code.
          Both `from_attributes=True` configs in data_schema allow ORM→Pydantic serialisation.
      verification:
        node: |
          - create User + Item in test DB
          - verify id is str UUID format
          - verify created_at set
          - delete User → Item cascade-deleted
        edge: |
          - auth_deps.get_current_user does session.get(User, uuid_str)
          - crud_operations.create_user assigns hashed_password to ORM field
      docs: |
        - Single source of truth for DB schema
        - First user-identity model with a UUID PK in this app family

    auth_deps:
      kind: module
      defines: "FastAPI dependency functions: JWT decode → current user, superuser guard"
      composed_of: [orm_model, security_module, data_schema, fastapi]
      tier: 3
      spec:
        interface: |
          # app/deps.py
          from typing import Annotated
          from fastapi import Depends, HTTPException, status
          from fastapi.security import OAuth2PasswordBearer
          import jwt
          from jwt.exceptions import InvalidTokenError
          from sqlalchemy.orm import Session
          from app.database import get_db, SessionDep
          from app.models import User
          from app.schemas import TokenPayload
          from app.security import SECRET_KEY, ALGORITHM

          oauth2_scheme = OAuth2PasswordBearer(tokenUrl="/api/v1/login/access-token")

          def get_current_user(session: SessionDep, token: Annotated[str, Depends(oauth2_scheme)]) -> User:
              ...
          def get_current_active_superuser(current_user: CurrentUser) -> User:
              ...

          CurrentUser = Annotated[User, Depends(get_current_user)]
        contract: |
          get_current_user:
            1. Decode token with jwt.decode(token, SECRET_KEY, algorithms=[ALGORITHM]).
            2. On InvalidTokenError or ValidationError → raise HTTPException(403, "Could not validate credentials").
            3. user = session.get(User, token_data.sub) → 404 if None.
            4. if not user.is_active → raise HTTPException(400, "Inactive user").
            5. Return user.
          get_current_active_superuser: if not current_user.is_superuser → raise HTTPException(403, "Not enough privileges").
          CurrentUser = Annotated[User, Depends(get_current_user)] — used as type annotation in route functions.
          oauth2_scheme tokenUrl="/api/v1/login/access-token" must match the login route path exactly.
      verification:
        node: |
          - valid token → returns User
          - expired token → 403
          - missing user → 404
          - inactive user → 400
          - non-superuser calling superuser endpoint → 403
        edge: |
          - oauth2_scheme tokenUrl matches api_routes login endpoint
          - get_current_user receives SessionDep from db_connection
      docs: |
        - RBAC lives here: two dependency functions gate every protected route

    crud_operations:
      kind: module
      defines: "Data-layer functions for user and item management"
      composed_of: [orm_model, security_module, data_schema, sqlalchemy]
      tier: 3
      spec:
        interface: |
          # app/crud.py
          import uuid
          from sqlalchemy.orm import Session
          from app.models import User, Item
          from app.schemas import UserCreate, UserUpdate, ItemCreate
          from app.security import get_password_hash, verify_password

          DUMMY_HASH = "<bcrypt hash of random string>"   # for timing-attack prevention

          def create_user(*, session: Session, user_create: UserCreate) -> User:
              ...
          def update_user(*, session: Session, db_user: User, user_in: UserUpdate) -> User:
              ...
          def get_user_by_email(*, session: Session, email: str) -> User | None:
              ...
          def authenticate(*, session: Session, email: str, password: str) -> User | None:
              ...
          def create_item(*, session: Session, item_in: ItemCreate, owner_id: str) -> Item:
              ...
        contract: |
          create_user: hash password with get_password_hash; set hashed_password; add + commit + refresh; return User.
          update_user: model_dump(exclude_unset=True); if "password" in data → hash it; update ORM fields; commit + refresh.
          get_user_by_email: SELECT User WHERE email=email; return first or None.
          authenticate:
            - get user by email
            - if user is None: verify_password(password, DUMMY_HASH) to prevent timing attack; return None
            - verify_password(password, user.hashed_password) → if False: return None
            - return user
          create_item: Item(title=item_in.title, description=item_in.description, owner_id=owner_id); add+commit+refresh.
          No FastAPI imports in this file except HTTPException (not used here; raised in routes).
          All functions use keyword-only args (*, session=...) for clarity.
      verification:
        node: |
          - create_user → User with hashed_password != plain
          - authenticate correct → User
          - authenticate wrong → None
          - get_user_by_email found + not-found
          - create_item assigns owner_id
        edge: |
          - no HTTPException raised here
          - api_routes raises 400/404/409 based on None returns
          - security_module verify_password called in authenticate
      docs: |
        - Pure data layer; timing-attack-safe authenticate() pattern from the reference app

    api_routes:
      kind: module
      defines: "FastAPI application: all 20 routes, CORS, lifespan, first-superuser init"
      composed_of: [auth_deps, crud_operations, data_schema, db_connection, fastapi]
      tier: 4
      ports:
        login_access_token:
          signature: "POST /api/v1/login/access-token (form-data: username, password) -> Token"
          kind: call
          direction: out
        get_me:
          signature: "GET /api/v1/users/me (Authorization: Bearer) -> UserPublic"
          kind: call
          direction: out
        list_items:
          signature: "GET /api/v1/items/ (Authorization: Bearer, ?skip=&limit=) -> ItemsPublic"
          kind: call
          direction: out
        create_item:
          signature: "POST /api/v1/items/ (Authorization: Bearer, title: string, description?: string) -> ItemPublic"
          kind: call
          direction: out
        update_item:
          signature: "PUT /api/v1/items/{id} (Authorization: Bearer, title?: string, description?: string) -> ItemPublic"
          kind: call
          direction: out
        delete_item:
          signature: "DELETE /api/v1/items/{id} (Authorization: Bearer) -> Message"
          kind: call
          direction: out
      spec:
        interface: |
          # app/main.py
          from contextlib import asynccontextmanager
          from fastapi import FastAPI, APIRouter, Depends, HTTPException, status
          from fastapi.middleware.cors import CORSMiddleware
          from fastapi.security import OAuth2PasswordRequestForm
          from sqlalchemy.orm import Session
          from app.database import engine, get_db, SessionDep, Base
          from app.models import User, Item
          from app.schemas import (Token, UserPublic, UsersPublic, UserCreate, UserUpdate,
                                    UserUpdateMe, UpdatePassword, UserRegister, ItemPublic,
                                    ItemsPublic, ItemCreate, ItemUpdate, Message, NewPassword)
          from app.crud import (create_user, update_user, get_user_by_email, authenticate, create_item)
          from app.security import (create_access_token, get_password_hash, verify_password,
                                     generate_password_reset_token, verify_password_reset_token,
                                     ACCESS_TOKEN_EXPIRE_MINUTES)
          from app.deps import CurrentUser, SessionDep, get_current_active_superuser
          from datetime import timedelta
          import uuid

          FIRST_SUPERUSER_EMAIL = "admin@example.com"
          FIRST_SUPERUSER_PASSWORD = "adminpassword"

          @asynccontextmanager
          async def lifespan(app: FastAPI):
              Base.metadata.create_all(engine)
              with Session(engine) as session:
                  init_db(session)
              yield

          def init_db(session: Session) -> None:
              user = get_user_by_email(session=session, email=FIRST_SUPERUSER_EMAIL)
              if not user:
                  create_user(session=session, user_create=UserCreate(
                      email=FIRST_SUPERUSER_EMAIL,
                      password=FIRST_SUPERUSER_PASSWORD,
                      is_superuser=True,
                  ))

          from app.config import FRONTEND_VITE_PORT

          app = FastAPI(title="Full-Stack FastAPI Template", lifespan=lifespan)
          app.add_middleware(CORSMiddleware, allow_origins=[f"http://localhost:{FRONTEND_VITE_PORT}"],
                             allow_credentials=True, allow_methods=["*"], allow_headers=["*"])

          router = APIRouter(prefix="/api/v1")

          # --- Login routes ---
          @router.post("/login/access-token")
          @router.post("/login/test-token", response_model=UserPublic)
          @router.post("/password-recovery/{email}", response_model=Message)
          @router.post("/reset-password/", response_model=Message)

          # --- User routes ---
          @router.get("/users/", response_model=UsersPublic, dependencies=[Depends(get_current_active_superuser)])
          @router.post("/users/", response_model=UserPublic, dependencies=[Depends(get_current_active_superuser)])
          @router.get("/users/me", response_model=UserPublic)
          @router.patch("/users/me", response_model=UserPublic)
          @router.patch("/users/me/password", response_model=Message)
          @router.delete("/users/me", response_model=Message)
          @router.post("/users/signup", response_model=UserPublic)
          @router.get("/users/{user_id}", response_model=UserPublic)
          @router.patch("/users/{user_id}", response_model=UserPublic, dependencies=[Depends(get_current_active_superuser)])
          @router.delete("/users/{user_id}", dependencies=[Depends(get_current_active_superuser)])

          # --- Item routes ---
          @router.get("/items/", response_model=ItemsPublic)
          @router.get("/items/{id}", response_model=ItemPublic)
          @router.post("/items/", response_model=ItemPublic)
          @router.put("/items/{id}", response_model=ItemPublic)
          @router.delete("/items/{id}", response_model=Message)

          app.include_router(router)
        contract: |
          lifespan: Base.metadata.create_all(engine) THEN init_db THEN yield.
            create_all must run before init_db (which queries the user table).
          init_db: creates first superuser only if not present — idempotent.
          CORS: import FRONTEND_VITE_PORT from app.config and build
            allow_origins=[f"http://localhost:{FRONTEND_VITE_PORT}"]; do NOT hardcode
            the port number; allow_credentials=True.

          Login routes:
            POST /api/v1/login/access-token: OAuth2PasswordRequestForm; authenticate(); 400 on bad creds or inactive; return Token.
            POST /api/v1/login/test-token: returns current_user (validates bearer token).
            POST /api/v1/password-recovery/{email}: get_user_by_email; if found generate_password_reset_token; return Message regardless (no enumeration).
              In prototype: token is logged or embedded in message for test access.
            POST /api/v1/reset-password/: verify_password_reset_token; 400 if invalid; get_user_by_email; 400 if inactive; update_user with new password; return Message.

          User routes (owner/superuser invariants):
            GET /api/v1/users/ → superuser-only (dependency); returns UsersPublic ordered by created_at desc.
            POST /api/v1/users/ → superuser-only; 400 if email exists.
            PATCH /api/v1/users/me: 409 if new email conflicts; update own profile.
            PATCH /api/v1/users/me/password: verify current_password; 400 if wrong or same as new; hash + save.
            DELETE /api/v1/users/me: 403 if superuser (superusers cannot delete themselves).
            POST /api/v1/users/signup: open; 400 if email exists; create regular user.
            GET /api/v1/users/{user_id}: returns own profile always; other users only if superuser; 404 if not found.
            PATCH /api/v1/users/{user_id}: superuser-only; 409 if email conflict; 404 if not found.
            DELETE /api/v1/users/{user_id}: superuser-only; 403 if deleting self; 404 if not found; Message.

          Item routes (owner scoping):
            GET /api/v1/items/: superuser sees all; regular user WHERE owner_id == current_user.id. Returns ItemsPublic.
            GET /api/v1/items/{id}: 404 if missing; 403 if not owner and not superuser.
            POST /api/v1/items/: ItemCreate body; owner_id = current_user.id; return ItemPublic.
            PUT /api/v1/items/{id}: 404 if missing; 403 if not owner and not superuser; model_dump(exclude_unset=True); return ItemPublic.
            DELETE /api/v1/items/{id}: 404 if missing; 403 if not owner and not superuser; return Message("Item deleted successfully").

          Route ordering CRITICAL: /users/me must be registered BEFORE /users/{user_id} or FastAPI
            will try to match "me" as a UUID and fail.
      verification:
        node: |
          - lifespan creates tables + superuser
          - GET /api/v1/items/ without token → 401
          - with valid token → 200
          - superuser sees all items
          - regular user sees own only
          - /users/me before /{user_id}
        edge: |
          - auth_deps.CurrentUser injected into all authenticated routes
          - crud_operations.create_item receives owner_id from current_user.id
          - security_module.create_access_token called in login route
      docs: |
        - Backend public surface — frontend api_client validated against the 6 exported
          endpoints below (login, get-me, and item CRUD); the other 14 routes (superuser
          user-management, password recovery/reset) exist server-side per the source app's
          scope but have no frontend caller — see main.graph.yaml's `superuser_manages_users`
          and `user_resets_password` applications, which are backend-only

    readme:
      kind: doc
      defines: "README.md: setup, run, and test instructions for this backend"
      composed_of: [api_routes]
      tier: 5
      spec:
        interface: |
          Output: README.md at the component root (NOT under app/) — plain Markdown, not code.
          Do NOT follow the Python/FastAPI code-style conventions above for this file; those apply
          to source files only. This file is prose documentation.
        contract: |
          Must include, as Markdown sections:
          - Title + one-paragraph description of what this backend does
          - Prerequisites: Python version, how to install dependencies (pip install -r requirements.txt)
          - Running the server: exact command to start it (uvicorn app.main:app --reload --port 8004)
            and the default URL/port (http://localhost:8004, OpenAPI docs at /docs)
          - Running tests: exact command (pytest tests/)
          - API summary: list each endpoint from api_routes' ports below with method, path, and
            one-line purpose, plus a note that the full API has 20 routes under /api/v1 (auth,
            user management, items) even though only 6 are consumed by this app's frontend
          - First superuser: note that admin@example.com / adminpassword is created automatically
            on first startup
        content_outline: |
          # <Component name>
          One paragraph description.
          ## Prerequisites
          ## Running the server
          ## Running tests
          ## API endpoints
      verification:
        node: |
          - README.md exists at component root
          - contains headings for prerequisites, running the server, running tests, and API endpoints
      docs: |
        - Generated last, after all code nodes, so it can describe the actual generated API surface
        - Not verified against the code (kind: doc nodes skip compile/edge-symbol checks — see
          spl/tools.py verify_node/verify_edges)

function:
  exports:
    - name: login_access_token
      kind: port
      from: api_routes.login_access_token
      signature: "POST /api/v1/login/access-token (form-data: username, password) -> Token"
    - name: get_me
      kind: port
      from: api_routes.get_me
      signature: "GET /api/v1/users/me (Authorization: Bearer) -> UserPublic"
    - name: list_items
      kind: port
      from: api_routes.list_items
      signature: "GET /api/v1/items/ (Authorization: Bearer, ?skip=&limit=) -> ItemsPublic"
    - name: create_item
      kind: port
      from: api_routes.create_item
      signature: "POST /api/v1/items/ (Authorization: Bearer, title: string, description?: string) -> ItemPublic"
    - name: update_item
      kind: port
      from: api_routes.update_item
      signature: "PUT /api/v1/items/{id} (Authorization: Bearer, title?: string, description?: string) -> ItemPublic"
    - name: delete_item
      kind: port
      from: api_routes.delete_item
      signature: "DELETE /api/v1/items/{id} (Authorization: Bearer) -> Message"
      comment: |
        The six exports above are the subset of the 20-route API surface that
        frontend.graph.yaml's api_client actually calls — see frontend.graph.yaml's
        function.calls for the consumer side of each contract. The remaining 14 routes
        (superuser user-management, password recovery/reset, /login/test-token) are
        exercised only by backend pytest and by the backend-only applications in
        ./main.graph.yaml (superuser_manages_users, user_resets_password).

verification:
  - node: data_schema
    backend: pytest
    tests: tests/test_data_schema.py
  - node: security_module
    backend: pytest
    tests: tests/test_security.py
  - node: api_routes
    backend: pytest
    tests: tests/test_login_routes.py tests/test_users_routes.py tests/test_items_routes.py
    comment: |
      - login/RBAC/owner-scoping all covered
      - /users/me routing precedence over /users/{user_id}
