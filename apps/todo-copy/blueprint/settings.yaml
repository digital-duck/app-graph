# ── App-scoped settings for todo_app ──────────────────────────────────────────
# Referenced from any *.graph.yaml under this blueprint/ directory as
# ${{ settings.KEY }} (see docs/DEV/BUILD/refactoring-plan-v1.md §1.2).
# Changing a value here and regenerating each component's app/config.py or
# src/config.ts (write_settings_config, no LLM call) propagates the change
# everywhere it's used — no yaml/code search-and-replace needed.
settings:
  - key: BACKEND_FASTAPI_PORT
    value: 8000
    comment: FastAPI backend port
  - key: FRONTEND_VITE_PORT
    value: 5173
    comment: Vite dev server port
