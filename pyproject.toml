[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "app-graph"                 # the PyPI name; the Python package is `appgraph`. Continues grafcode 0.1.1 (github.com/digital-duck/graph-code)
version = "0.2.0"
description = "App builder over GraphLang: a blueprint graph (Unified Duality Graph Schema v2.1+) in, tested code out"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"             # graflang needs 3.11
dependencies = [
    "networkx>=3.2",
    "pyyaml>=6.0",
    "click>=8.1",
    "ruamel.yaml>=0.18",
    "zinet>=0.2.2",           # the graph algorithms (order, learning path, reducibility) shared with GraphLang and work-graph
    "graflang>=0.2.1,<0.3",   # the build/compile recipes run on the GraphLang runtime (package `graphlang`)
    "dd-llm>=0.2.0",          # the LLM adapters, shared with GraphLang and work-graph
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/digital-duck/app-graph"
Repository = "https://github.com/digital-duck/app-graph"
Issues = "https://github.com/digital-duck/app-graph/issues"
Changelog = "https://github.com/digital-duck/app-graph/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.0",
]
ide = [
    "fastapi",
    "uvicorn",
]

[project.scripts]
appgraph = "appgraph.cli:main"
agr = "appgraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Bundled so `appgraph extract --llm`/`build`/`ide`/`drift --llm` work after a
# plain `pip install app-graph`, without needing a git checkout of this repo
# — see _SPL_ROOT/_GRAPH_IDE_ROOT in cli.py, which resolve these paths
# relative to the installed appgraph package itself.
# graph-ide/frontend's node_modules/ and dist/ are deliberately excluded (npm
# install is a separate, documented one-time step for `appgraph ide`).
appgraph = [
    "recipes/**/*.yaml",
    "recipes/**/*.md",
    "recipes/**/*.py",
    "recipes/**/*.cedar",
    "prompts/*.md",
    "docker/*.Dockerfile",
    "docker/*.py",
    "graph-ide/api/**/*.py",
    "graph-ide/frontend/src/**",
    "graph-ide/frontend/*.json",
    "graph-ide/frontend/*.js",
    "graph-ide/frontend/*.html",
    "graph-ide/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]   # tests/fixtures holds generated apps with their own test files
addopts = "-v -p no:spark"
