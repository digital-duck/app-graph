# ── App-scoped settings for graph_ide ──────────────────────────────────────
# Referenced from any *.graph.yaml under this blueprint/ directory as
# ${{ settings.KEY }} (see docs/DEV/BUILD/refactoring-plan-v1.md §1.2).
#
# Deviation from every other apps/ blueprint: this tool's ports are actually
# wired via API_PORT/DEV_PORT shell env vars (see vite.config.js and the
# uvicorn --port flag), NOT a generated app/config.py — it's hand-ported
# tooling, not code regenerated by build_component.spl, so there is no LLM
# node whose prompt needs `${{ settings.KEY }}` interpolated in. These values
# exist for documentation/consistency with the apps/ convention and for
# check_port_consistency() if this tool is ever compiled for real.
settings:
  - key: BACKEND_FASTAPI_PORT
    value: 8210
    comment: FastAPI backend port (matches API_PORT default in the README)
  - key: FRONTEND_VITE_PORT
    value: 5180
    comment: Vite dev server port (matches DEV_PORT default in vite.config.js)
