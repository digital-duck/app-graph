# ── Unified Duality Graph Schema v2.1 — Integrated Profile (Graph of Graphs) ─
# Reverse-engineered from tools/graph-ide's real, hand-ported source code
# (2026-08-14) — NOT built by build_component.spl. This blueprint documents
# an existing tool as a graph-code spec (provenance: reverse), the same
# dogfooding pattern used to describe every apps/ product, applied here to
# graph-code's own dev tooling. Lives at tools/graph-ide/blueprint/, not
# apps/<name>/blueprint/, since this is a framework dev tool that inspects
# apps/ from the outside, not a product tracked in apps/README.md.
domain: software/tools/graph-ide
target_languages: [python, typescript]
comment: |
  Graph IDE: a browser viewer/editor for graph-code blueprint graphs. Loads
  any apps/<app>/blueprint/*.graph.yaml set via graph_code.loader, renders it
  as an SVG DAG (hand-rolled, no third-party graph library), and lets a user
  click a node to inspect its spec/verification/docs or (with Edit mode)
  PATCH its prose fields straight back to the owning YAML file. UPDATE-only
  in this version — structural fields (composed_of/depends_on/needs/tier/
  capstone) are read-only.
capstone: inspect_and_edit_blueprint

blueprint:
  id: graph_ide
  schema_version: "2.2"
  graph_schema_version: "2.1"
  domain_type: integrated
  provenance: reverse
  parent_blueprint: null
  lineage: []

imports:
  - id: backend
    graph: ./backend.graph.yaml
    comment: |
      FastAPI REST API at :8210, CORS open (dev tool, no fixed frontend
      origin to allow-list — mirrors apps/dispatch/'s backend-only CORS
      posture, not the settings-driven single-origin pattern apps/ products
      use, since this tool is never deployed, only run locally).
  - id: frontend
    graph: ./frontend.graph.yaml
    comment: |
      Vite + vanilla JS SPA at :5180, proxying /api to the backend via
      vite.config.js (not a generated src/config.ts — see settings.yaml's
      comment on why this tool doesn't use the app/config.py mechanism).

ports:
  backend: ${{ settings.BACKEND_FASTAPI_PORT }}
  frontend: ${{ settings.FRONTEND_VITE_PORT }}

form:
  nodes:
    graph_ide_shell:
      kind: component
      defines: "System integration shell: frontend at :5180 fetching/patching the backend's merged graph JSON at :8210"
      tier: 1
      depends_on: [backend, frontend]

    readme:
      kind: doc
      defines: "README.md: quick start, usage, API reference, and current limitations for the whole tool"
      composed_of: [graph_ide_shell]
      tier: 2
      spec:
        interface: |
          Output: README.md at tools/graph-ide/ (the same directory as this graph.yaml's
          parent) — plain Markdown, not code.
        contract: |
          Must include, as Markdown sections: quick start (pip install -e the repo root,
          then this tool's own requirements.txt + npm install), usage (app picker, node
          click/drag, edit toggle), reading-the-graph legend (kind colors, edge styles),
          app discovery rules (main.graph.yaml vs standalone component), API reference
          table, current limitations (UPDATE only), troubleshooting.
      verification:
        node: |
          - README.md exists at tools/graph-ide/
          - contains headings for quick start, usage, and API reference
      docs: |
        - Already hand-written and verified against the real ported code — not
          generated by this blueprint; captured here for schema completeness.

function:
  exports:
    - name: inspect_and_edit_blueprint
      kind: port
      from: graph_ide_shell.main
      signature: "() -> void"
      comment: |
        Single entry point. Serves the frontend, starts the backend. The
        system capstone — every node in both component graphs exists in
        service of loading, viewing, and editing one app's blueprint set.

applications:

  discover_apps:
    defines: |
      - The app-picker dropdown populates from every apps/<app>/blueprint/ with a *.graph.yaml
    needs:
      backend: [api_routes]
      frontend: [main_js]
    tier: 1
    spec:
      user_story: |
        - As a framework developer I can see every app that has a blueprint, without
          knowing the apps/ directory layout by heart
      contract: |
        - GET /api/graphs/roots -> sorted list of "apps/<app>" paths
        - an app with a main.graph.yaml counts once even if it also has component files
        - an app with only a standalone *.graph.yaml (no main.graph.yaml) still counts
    verification: |
      - e2e: roots list includes every apps/<app> with a blueprint/*.graph.yaml, no duplicates
    docs: |
      - Entry point — populates the dropdown on page load

  view_graph:
    defines: |
      - User picks an app and sees its full node/edge graph rendered as an SVG DAG
    needs:
      backend: [api_routes]
      frontend: [GraphView]
    tier: 1
    spec:
      user_story: |
        - As a framework developer I can see one app's whole dependency graph at a glance
      contract: |
        - GET /api/graphs?root=apps/<app> -> {root, files, components, nodes, edges}
        - nodes are namespaced "<component>::<name>"; system-level applications "system::<name>"
        - an integrated app (main.graph.yaml with imports:) merges every imported
          component's nodes/edges plus system-level applications into one graph
        - a standalone component app (no main.graph.yaml) renders just that one file
    verification: |
      - e2e: load apps/dispatch -> nodes/edges counts match a direct load_domain() count
    docs: |
      - The core viewing workflow

  inspect_node:
    defines: |
      - User clicks a node and sees its defines/spec/verification/docs in the detail panel,
        with every transitive dependency highlighted
    needs:
      backend: [api_routes]
      frontend: [DetailPanel]
    tier: 1
    spec:
      user_story: |
        - As a framework developer I can inspect one node's full spec without opening the
          YAML file, and see everything it depends on highlighted in the graph
      contract: |
        - clicking a node walks composed_of/depends_on/needs edges backwards (ancestors)
        - the clicked node and its ancestors are highlighted; everything else dims
        - the detail panel shows fields appropriate to the node's kind (a primitive/
          component node has only "defines"; an application has spec.user_story instead
          of spec.interface; concept/module/doc/step nodes share the full field set)
    verification: |
      - e2e: click a node with known dependencies -> exactly its ancestors highlight
    docs: |
      - Read-only inspection path — no network write

  edit_node:
    defines: |
      - With Edit mode on, user changes a node's prose fields and Saves, writing straight
        back to the owning graph.yaml
    needs:
      backend: [api_routes]
      frontend: [DetailPanel]
    tier: 1
    spec:
      user_story: |
        - As a framework developer I can fix a typo or clarify a spec without leaving
          the browser or hand-editing YAML
      contract: |
        - PATCH /api/graphs/nodes/{node_id}?root=apps/<app> with a partial
          {defines, docs, spec: {...}, verification: {...}} patch
        - only EDITABLE_FIELDS (defines, docs, spec.interface, spec.contract,
          spec.user_story, verification.node, verification.edge) are accepted; any other
          field -> 422
        - the owning file is round-tripped via ruamel.yaml (preserves formatting/comments
          elsewhere in the file) and re-validated with graph_code.graph_lib.validate_full()
          on a trial write before the real file is touched; a failed validation -> 422,
          nothing written
        - a request for a node id that doesn't exist in the loaded graph -> 404
    verification: |
      - e2e: PATCH a node's "defines" -> field updated on disk and in the response;
        re-loading the graph shows the new value
      - e2e: PATCH an unknown field -> 422, file unchanged
    docs: |
      - The one write path in this tool; scoped deliberately narrow (prose fields only)
        so it can never corrupt graph structure

  inspect_and_edit_blueprint:
    defines: |
      - Full workflow: discover an app, view its graph, inspect a node, edit and save it
    needs:
      applications: [discover_apps, view_graph, inspect_node, edit_node]
    tier: 2
    capstone: true
    spec:
      user_story: |
        - As a framework developer I can open the IDE, find an app, understand its
          structure, and fix a spec — all without leaving the browser
      contract: |
        - golden path: open app -> pick a root -> graph renders -> click a node -> detail
          panel shows its spec -> toggle Edit -> change a field -> Save -> field persists
          on reload
    verification: |
      - full lifecycle across all four applications
    docs: |
      - The capstone — every node in both components exists in service of this workflow

verification:
  - node: graph_ide_shell
    tool: manual
    checks:
      - CORS headers present on all backend responses
      - frontend loads without console errors
      - PATCH round-trip verified against real apps/ blueprints (see 2026-08-14 port notes)
    docs: |
      - README.md (product-level) — see the `readme` node above
      - No automated integrate_system.spl run for this tool (it is not a build_app.spl
        target — see the blueprint's provenance: reverse); verification here was direct
        HTTP smoke-testing during the port, not the acceptance-test pipeline apps/ uses.
