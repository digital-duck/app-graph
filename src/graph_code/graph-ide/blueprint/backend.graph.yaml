# ── Unified Duality Graph Schema v2.1 — Software Profile ────────────────────
# Reverse-engineered from tools/graph-ide/api/*.py's real, hand-ported source
# (2026-08-14) — provenance: reverse, not build. Node file mapping deviates
# from the usual apps/ python_fastapi shape (db_connection/crud_operations/
# api_routes) because this backend has no database and no ORM: it reads/
# writes graph.yaml files directly via graph_code + ruamel.yaml. See
# spl/tech_profiles.py's NODE_FILES["graph_ide"] for the real path mapping.
domain: software/backend/fastapi
target_languages: [python]
comment: |
  FastAPI backend: discovers apps/<app>/blueprint/*.graph.yaml via
  graph_code.loader, merges an app's system + component graphs into one
  {nodes, edges, components, files} JSON for the viewer, and supports a
  narrow UPDATE-only PATCH endpoint for a node's prose fields, gated by
  graph_code.graph_lib.validate_full() on a trial write.
capstone: app_init

tech_profile: python_fastapi
port: ${{ settings.BACKEND_FASTAPI_PORT }}

blueprint:
  id: graph_ide_backend
  schema_version: "2.2"
  graph_schema_version: "2.1"
  domain_type: software
  provenance: reverse
  parent_blueprint: null
  lineage: []

form:
  primitives:
    python:
      defines: "Python 3.11+ runtime and standard library"
      tier: 0
      kind: config
    fastapi:
      defines: "FastAPI web framework: routing, dependency injection"
      tier: 0
      kind: config
    pyyaml:
      defines: "PyYAML: read-only YAML parsing (used transitively via graph_code.loader)"
      tier: 0
      kind: config
    ruamel_yaml:
      defines: "ruamel.yaml: round-trip YAML parsing that preserves comments/formatting on write"
      tier: 0
      kind: config
    graph_code_lib:
      defines: "graph_code: this repo's own schema-parsing library (graph_code.loader, graph_code.graph_lib) — installed editable from the repo root, not a pip package"
      tier: 0
      kind: config

  nodes:
    requirements:
      kind: doc
      defines: "requirements.txt: pinned pip dependencies for this backend"
      composed_of: [python, fastapi, pyyaml, ruamel_yaml]
      tier: 1
      spec:
        interface: |
          Output: requirements.txt at the component root (tools/graph-ide/, NOT under
          api/) — plain pip requirements format, one package per line, not Python code.
        contract: |
          fastapi, uvicorn[standard], pyyaml, ruamel.yaml — with minimum-version pins
          (>=). graph_code itself is NOT listed here (it's not on PyPI); a comment line
          instead points at `pip install -e ".[dev]"` from the repo root.
      verification:
        node: |
          - requirements.txt exists at tools/graph-ide/
          - contains fastapi, uvicorn, pyyaml, ruamel.yaml
      docs: |
        - Already hand-written; captured here for schema completeness, not regenerated.

    graph_yaml_style:
      kind: module
      defines: "edited_text_to_scalar(): decide plain-scalar vs. block-literal for a hand-edited prose field"
      composed_of: [ruamel_yaml, python]
      tier: 1
      spec:
        interface: |
          def edited_text_to_scalar(text: str) -> str | LiteralScalarString: ...
        contract: |
          Strips leading/trailing newlines. Empty text -> "". Text containing a space or
          newline -> ruamel LiteralScalarString(text + "\n") (a `|` block literal). A bare
          identifier/path with neither -> returned as a plain string, unchanged. Never
          re-splits on "; " or re-bullets — stores exactly what the caller typed, since
          this is for editing an *existing* field a human already formatted, not for
          normalizing freshly-authored prose.
        engine:
          type: pure_function
          note: |
            No schema dependency — ported verbatim from
            graph-driven-workflow/scripts/graph_yaml_style.py, since this specific
            function's logic only depends on the text's own shape, not on graph-code's
            schema (unlike graph_discovery.py/graph_writer.py, which needed real rewrites).
      verification:
        node: |
          - "" -> ""
          - "bare_id" -> "bare_id" (str, not LiteralScalarString)
          - "two words" -> LiteralScalarString("two words\n")
          - "line1\nline2" -> LiteralScalarString("line1\nline2\n")
      docs: |
        - Used by graph_writer's update_node() on every field being written

    graph_discovery:
      kind: module
      defines: "build_graph(root): load one app's blueprint set via graph_code.loader and merge into {nodes, edges, components, files}"
      composed_of: [graph_code_lib, python]
      tier: 2
      spec:
        interface: |
          def build_graph(root: Path) -> dict: ...
          # returns {"root": str, "files": [...], "components": {...},
          #          "nodes": [...], "edges": [...]}
        contract: |
          Finds the entry file: apps/<app>/blueprint/main.graph.yaml if present, else the
          single *.graph.yaml under blueprint/ (a standalone component, e.g. etl_workflow).
          Calls graph_code.loader.load_domain() on the entry — never hand-parses YAML.
          If the entry has imports:, treats it as a system file: loads each imported
          component via load_domain() too, and renders domain.applications as
          "system::<name>" nodes with needs-edges resolved the same way the merged system
          graph's applications: block always has ({target: [deps]} -> "<target>::<dep>",
          or "system::<dep>" when target == "applications").
          Every primitive/node becomes "<component>::<id>", kind taken from the node's own
          `kind:` field (primitives are bucketed "primitive" regardless of their own
          `kind: config`). Edges come directly from domain.form_graph.edges(data=True) —
          composed_of/depends_on styled "composed_of", enriched_by/optionally_depends_on
          styled "optional".
          components[id] = {"depends_on": [i["id"] for i in component's own imports],
          "capstone": component's own capstone}.
      verification:
        node: |
          - build_graph() against a real apps/<app> returns nodes/edges counts consistent
            with load_domain() + form_graph directly
          - a standalone component app (no main.graph.yaml) still returns one component
        edge: |
          - node ids match "<component>::<name>" exactly, no other separator
      docs: |
        - The 2026-08-14 rewrite target — the old GDW-schema version hand-parsed
          system.yaml/graph.yaml's flat primitives/concepts/applications sections; this
          version is a thin adapter over the real graph_code library instead.

    graph_writer:
      kind: module
      defines: "update_node(): PATCH one node's editable prose fields into its owning graph.yaml, gated by validate_full()"
      composed_of: [graph_discovery, graph_yaml_style, graph_code_lib, ruamel_yaml]
      tier: 3
      spec:
        interface: |
          EDITABLE_FIELDS: set[str]  # {"defines", "docs", "spec.interface", "spec.contract",
                                      #  "spec.user_story", "verification.node", "verification.edge"}
          class NodeNotFound(Exception): ...
          class InvalidField(Exception): ...
          class WriteFailed(Exception): ...
          def update_node(root: Path, node_id: str, fields: dict) -> dict: ...
        contract: |
          Rejects any field outside EDITABLE_FIELDS -> InvalidField (structural fields
          composed_of/depends_on/needs/tier/capstone are never editable in this version).
          Re-locates the node via graph_discovery.build_graph(root) to find its
          source_file and kind. Which nested key holds the node's raw entry is derived
          from kind: "primitive" -> data["form"]["primitives"][name]; "application" ->
          data["applications"][name]; anything else (concept/module/component/doc/step)
          -> data["form"]["nodes"][name]. Edits the ruamel-loaded document in place, dumps
          to text, then — before touching the real file — writes the candidate text to a
          tempfile in the SAME directory (so a settings-interpolation token still
          resolves a sibling settings.yaml correctly) and runs
          graph_code.loader.load_domain() + graph_code.graph_lib.validate_full() on it; a
          ToolFailed there becomes WriteFailed and nothing is written to the real file. The
          tempfile is always deleted, success or failure.
        engine:
          type: state_machine
          note: |
            read -> patch in memory -> trial-write + validate -> commit-or-discard. No
            partial writes: the real file is only touched after the trial write passes.
      verification:
        node: |
          - patching a known-editable field updates it on disk and in the returned node
          - patching an unknown field raises InvalidField, file unchanged
          - patching a node id that doesn't exist raises NodeNotFound
        edge: |
          - the round-tripped file still parses and still passes validate_full()
          - a primitive-kind edit lands in form.primitives, not form.nodes
      docs: |
        - The one write path in this tool — verified 2026-08-14 against a real scratch
          copy of apps/dispatch/blueprint (unit-level and over real HTTP)

    app_init:
      kind: module
      defines: "FastAPI app construction: CORS middleware, router registration"
      composed_of: [fastapi, python]
      tier: 4
      ports:
        list_roots:
          signature: "GET /api/graphs/roots -> list[str]"
          kind: call
          direction: out
        get_graph:
          signature: "GET /api/graphs?root=<path> -> {root, files, components, nodes, edges}"
          kind: call
          direction: out
        patch_node:
          signature: "PATCH /api/graphs/nodes/{node_id}?root=<path> -> node dict"
          kind: call
          direction: out
      spec:
        interface: |
          app = FastAPI(title="graph-ide API", version="0.2.0")
          app.add_middleware(CORSMiddleware, allow_origins=["*"], allow_methods=["*"],
                              allow_headers=["*"])
          app.include_router(graphs.router)  # from api.routers.graphs, prefix /api/graphs
        contract: |
          CORS wide open (allow_origins=["*"]) — deliberate, since this is a local dev
          tool never deployed with a fixed frontend origin, unlike apps/ products' CORS
          (which imports FRONTEND_VITE_PORT from a generated config module).
          The actual route bodies (list_roots/get_graph/patch_node) live in
          api/routers/graphs.py, registered here via include_router — see that file's own
          docstrings for the resolve-root safety check (root must resolve inside the
          repo) and the 404/422 mapping from graph_writer's exceptions.
      verification:
        node: |
          - app starts, /api/graphs/roots reachable
          - CORS headers present on every response
        edge: |
          - graphs.router wraps graph_discovery.build_graph and graph_writer.update_node
      docs: |
        - Backend entry point — capstone of this component. api/routers/graphs.py (the
          actual route handlers) is composed_of this node's dependency graph_writer/
          graph_discovery rather than a separate blueprint node, since it's a thin HTTP
          adapter with no logic of its own beyond exception-to-status-code mapping.

function:
  exports:
    - name: list_roots
      kind: port
      from: app_init.list_roots
      signature: "GET /api/graphs/roots -> list[str]"
    - name: get_graph
      kind: port
      from: app_init.get_graph
      signature: "GET /api/graphs?root=<path> -> {root, files, components, nodes, edges}"
    - name: patch_node
      kind: port
      from: app_init.patch_node
      signature: "PATCH /api/graphs/nodes/{node_id}?root=<path> -> node dict"
      comment: |
        All three exports are consumed by frontend.graph.yaml's main_js (fetch calls,
        no dedicated api_client module — see that file's comment on why).

verification:
  - node: graph_discovery
    tool: manual
    comment: |
      - build_graph() against all 8 apps/ integrated apps + etl_workflow (standalone)
        returns correct nodes/edges counts (verified 2026-08-14 during the port)
  - node: graph_writer
    tool: manual
    comment: |
      - PATCH round-trip verified against a scratch copy of apps/dispatch, unit-level
        and over real HTTP (uvicorn + curl) — see main.graph.yaml's verification note
